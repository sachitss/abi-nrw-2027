<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}

:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#152033; --muted:#566178; --line:#D5DBE5;
  --red:#5B3CC4; --red-soft:#ECE7FB; --blue:#1E5FB7; --blue-soft:#E3EBFB;
  --good:#1D7446; --good-soft:#E1F3E8; --warn:#9A6200; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FCE6E3;
  --an-voc:#CFE1FF; --an-ev:#FFE39A; --an-sty:#F7C9E6; --an-arg:#C8EFD5; --an-imp:#FFD2C2;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 4px 16px rgba(21,32,51,.06);
  --r:10px; --nav:0px;
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --fb:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#0E131C;--surface:#161D2A;--sunk:#1D2535;--ink:#E6EAF2;--muted:#9AA4B8;--line:#2A3448;
  --red:#8C77F7;--red-soft:#2A2344;--blue:#86A8F5;--blue-soft:#1C2A48;--good:#5CCB8B;--good-soft:#16301F;--warn:#E7B458;--warn-soft:#352812;--bad:#FF8577;--bad-soft:#3A1C1A;
  --an-voc:#23406F;--an-ev:#5A4A12;--an-sty:#5B2748;--an-arg:#1D4A2F;--an-imp:#5A2E1D;--shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#0E131C;--surface:#161D2A;--sunk:#1D2535;--ink:#E6EAF2;--muted:#9AA4B8;--line:#2A3448;
  --red:#8C77F7;--red-soft:#2A2344;--blue:#86A8F5;--blue-soft:#1C2A48;--good:#5CCB8B;--good-soft:#16301F;--warn:#E7B458;--warn-soft:#352812;--bad:#FF8577;--bad-soft:#3A1C1A;
  --an-voc:#23406F;--an-ev:#5A4A12;--an-sty:#5B2748;--an-arg:#1D4A2F;--an-imp:#5A2E1D;--shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--fb);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:.35em 0 .7em}
a{color:var(--blue)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.small{font-size:.88rem}.muted{color:var(--muted)}
.eyebrow,.lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:.2em 0 .4em}
h1[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-inline:16px;max-width:1280px;margin:0 auto}
.brand{font-family:var(--fd);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand b{color:var(--red);position:relative}
.brand b::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-3px;height:3px;background:var(--red);border-radius:2px;transform:rotate(-2deg)}
.brand small{font-family:var(--fm);font-size:.72rem;color:var(--muted);font-weight:400}
.kurs{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.kurs select{max-width:52vw;font-size:16px}
@media (max-width:430px){.kurs .kl{display:none}.brand small{display:none}}
select,.inp,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%}
textarea{width:100%;line-height:1.6;resize:vertical}
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;text-decoration:none;color:var(--muted);font-size:.72rem;min-height:56px}
.nav a[aria-current="page"]{color:var(--red);font-weight:700}
.nav a[aria-current="page"] .ic{transform:translateY(-1px)}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
#main{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:76px;gap:4px;padding-inline:12px}
  .nav a{flex:none;flex-direction:row;gap:12px;font-size:.98rem;padding:12px 14px;border-radius:10px;min-height:48px}
  .nav a[aria-current="page"]{background:var(--red-soft)}
  .top{padding-left:0}
  body{padding-left:210px}
  #main{padding-inline:32px;padding-block:28px 60px}
  .top-in{padding-inline:32px}
}

/* Bausteine */
.panel,.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 16px}
.sec>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph h2{margin:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:middle}
.tag.off{background:var(--blue-soft);color:var(--blue)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 .95rem var(--fb);background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;text-decoration:none}

/* Heute */
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}

.ring{--p:0;width:112px;height:112px;flex:none;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-content:center;text-align:center;position:relative}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--paper)}
.ring>*{position:relative}.ring span{font-size:1.5rem;font-weight:600}.ring small{font-size:.7rem;color:var(--muted)}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}

.grid2>.panel{margin:0}
.daycard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--sunk);border-radius:10px;padding:12px 14px}
.dc-n{grid-row:1/3;font-size:.8rem;color:var(--red);font-weight:600;writing-mode:horizontal-tb}

.dc-p{grid-row:1/3;grid-column:3}.daycard .bar{grid-column:1/4;margin-top:8px}
.bar{display:block;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.daycard .bar{background:var(--surface)}
.bar>span{display:block;height:100%;background:var(--blue);border-radius:99px}
.b-good{background:var(--good)!important}.b-warn{background:var(--warn)!important}.b-bad{background:var(--bad)!important}
.recs{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px;font-size:.92rem}
.recs li{display:flex;gap:8px;align-items:baseline}
.sev{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transform:translateY(1px)}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}
.skills{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.skills li{display:grid;grid-template-columns:8.5em 1fr 3em;gap:10px;align-items:center;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:0 0 16px}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
.stats.mini>div{background:var(--sunk);border:0}
.big2{font-size:1.5rem;color:var(--ink);font-weight:600}
.badges{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.badges li{border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;font-size:.82rem;color:var(--muted)}
.badges li strong{color:var(--muted)}
.badges li.on{border:1.5px solid var(--red);background:var(--red-soft)}.badges li.on strong{color:var(--ink)}

/* Plan */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:6px 0 10px}
.seg.sm{display:inline-flex;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.seg button{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:44px}
.seg.sm button{border:0;border-radius:0;padding:8px 12px;font-size:.88rem;border-right:1px solid var(--line)}
.seg button small{color:var(--muted);font-size:.78rem}
.seg button[aria-checked="true"]{border-color:var(--red);background:var(--red-soft)}
.seg.sm button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:10px 0}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.p1,.dl.ph-1 .dn{background:var(--blue-soft);color:var(--blue)}.lg.p2,.dl.ph-2 .dn{background:var(--warn-soft);color:var(--warn)}.lg.p3,.dl.ph-3 .dn{background:var(--red-soft);color:var(--red)}

.daylist{list-style:none;padding:0;margin:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-decoration:none;color:var(--ink);min-height:52px}

.dt{font-weight:700;font-size:.95rem;display:flex;flex-direction:column;min-width:0}
.dt small{font-weight:400;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp{font-size:.78rem;color:var(--muted)}

/* Tag */
.dayhead{margin-bottom:14px}
.mcard{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}

.mc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--muted);font-size:.74rem;text-align:center;min-height:64px}

.sec .mark{margin-top:10px}

.daynav{display:flex;justify-content:space-between;margin-top:10px}
.vl{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:6px}

.exl{padding-left:0;list-style:none}.exl li{margin:4px 0}

.rm{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rm li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.rm em{color:var(--muted);font-size:.9rem}
.wrongl{padding-left:1.2em}.wrongl li{margin:3px 0}

/* Übungen */
.ex{border-top:1px dashed var(--line);padding-top:10px;margin:10px 0;border-left:0;border-right:0;border-bottom:0;padding-inline:0}
.ex-q{font-weight:700;display:block;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.opt:disabled{cursor:default;opacity:1}
.radio{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;min-height:46px;cursor:pointer}
.radio input{width:20px;height:20px;flex:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-col{display:grid;gap:8px;align-content:start}
.m-l,.m-r,.chip{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:46px;cursor:pointer;text-align:left}
.m-l.sel{border-color:var(--blue);background:var(--blue-soft)}
.m-l.right,.m-r.right{border-color:var(--good);background:var(--good-soft)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 12px}.chip:disabled{opacity:.3}
.built{min-height:48px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-weight:700}
.inp{flex:1;min-width:0}
.timer{display:inline-flex;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:6px 6px 6px 12px}
.t-l{font-size:.82rem;color:var(--muted)}.t-v{font-size:1.1rem;font-weight:600}

.checks{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--sunk);cursor:pointer;min-height:44px}
.checks input{width:20px;height:20px;flex:none;margin-top:2px}
.checks label.isrel{background:var(--good-soft)}.checks label.notrel{text-decoration:line-through;opacity:.7}
.fbl{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px;font-size:.92rem}
.fbl li{padding:8px 10px;border-radius:8px;border-left:4px solid var(--line);background:var(--sunk)}
.fbl li.good{border-color:var(--good);color:var(--ink)}.fbl li.warn{border-color:var(--warn);color:var(--ink)}.fbl li.bad{border-color:var(--bad);color:var(--ink)}

/* Player */
.player{background:var(--sunk);border-radius:12px;padding:12px;margin:8px 0}
.p-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-btn{font:600 .85rem var(--fm);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:50%;width:46px;height:46px;cursor:pointer;display:grid;place-content:center}
.p-main{width:56px;height:56px;background:var(--red);color:#fff;border:0}
.p-speed{display:flex;margin-left:auto;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.p-speed button{font:600 .8rem var(--fm);background:var(--surface);color:var(--ink);border:0;border-right:1px solid var(--line);padding:0 9px;min-height:40px;cursor:pointer}
.p-speed button:last-child{border-right:0}
.p-speed button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.p-bar{height:12px;background:var(--surface);border-radius:99px;margin:12px 0 4px;cursor:pointer;overflow:hidden;border:1px solid var(--line)}

.p-time{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}

.p-lines span.now{background:var(--an-ev);border-radius:4px}

/* Module */
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0 0 16px}
.mod{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);min-height:96px}

.mod strong{font-family:var(--fd);font-size:1.05rem}.mod span{font-size:.84rem;color:var(--muted)}
.mod:hover{border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:2px;min-width:0;flex:1 1 200px}
.filters select{width:100%}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:200px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-bottom:4px solid var(--red);border-radius:14px;padding:20px;cursor:pointer;margin:8px 0 12px}
.f-front,.f-back>span{font-family:var(--fd);font-size:clamp(1.4rem,5vw,2rem);font-weight:700;text-align:center}
.f-back{display:flex;flex-direction:column;align-items:center;gap:6px}.f-back[hidden]{display:none}
.f-back em{color:var(--muted);text-align:center}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}

.glist{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.glist a>*{min-width:0}
.glist a{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px}
.warnsec{border-color:var(--warn);background:var(--warn-soft)}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.op{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.92rem}

.split{display:grid;gap:16px}

.text{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 44px;font-size:1.02rem;line-height:1.75;max-width:68ch}

.ln{position:absolute;left:-32px;top:.2em;font-size:.72rem;color:var(--muted)}
.text.src{padding-left:16px}
.s{border-radius:4px;cursor:pointer;padding:1px 0}
.s:hover{background:var(--sunk)}
.hl-good{background:var(--good-soft)!important;outline:2px solid var(--good)}.hl-bad{background:var(--bad-soft)!important}
.an-voc{background:var(--an-voc)}.an-ev{background:var(--an-ev)}.an-sty{background:var(--an-sty)}.an-arg{background:var(--an-arg)}.an-imp{background:var(--an-imp)}
.s.an-voc,.s.an-ev,.s.an-sty,.s.an-arg,.s.an-imp{color:var(--ink)}
.annobar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.annobar button[role=radio]{font:700 .85rem var(--fb);color:var(--ink);border:2px solid transparent;border-radius:8px;padding:8px 12px;min-height:42px;cursor:pointer}
.annobar button[aria-checked="true"]{border-color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.steps{padding-left:1.3em}.steps>li{margin-bottom:14px}.steps>li::marker{font-family:var(--fm);color:var(--red);font-weight:600}
.stage{background:var(--ink);color:var(--paper);border-radius:14px;padding:22px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;margin:10px 0}
.slide h2{font-size:1.5rem;color:var(--paper)}.slide ul{font-size:1.08rem;padding-left:1.2em}
.slide.in{animation:fi .45s ease}@keyframes fi{from{opacity:.3;transform:translateY(6px)}}
.subs{background:rgba(0,0,0,.35);border-radius:8px;padding:8px 12px;font-size:.98rem}
.subs p{margin:2px 0}.subs p[lang=de]{opacity:.85;font-style:italic}
.cgrid,.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.card.dim{opacity:.6}
.timeline{display:flex;gap:4px;border-radius:10px;overflow:hidden;margin:10px 0}
.timeline>div{padding:10px;display:flex;flex-direction:column;gap:2px;font-size:.82rem;min-width:0}
.timeline strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-HV{background:var(--blue-soft);color:var(--blue)}.tl-SM{background:var(--warn-soft);color:var(--warn)}.tl-SL{background:var(--red-soft);color:var(--red)}
.strat{padding-left:1.4em}.strat li{margin-bottom:8px}.strat li::marker{font-family:var(--fm);color:var(--red)}

.rules dt{font-weight:700;margin-top:8px}.rules dd{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.infog{margin:0 0 8px;background:var(--sunk);border-radius:10px;padding:12px}

.letter{white-space:pre-wrap;font:1rem/1.6 var(--fb);background:var(--sunk);padding:14px;border-radius:10px}
.rgrid{display:grid;gap:4px}
.rrow{display:grid;grid-template-columns:1fr 120px 4em;gap:10px;align-items:center;font-size:.86rem;padding:4px 0;border-bottom:1px solid var(--line)}

.rrow input{width:100%;accent-color:var(--red);min-height:32px}
.rsum{font-size:1.05rem;margin-top:8px}
.hvbox{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.tk.alt{opacity:.95}
.st{font-size:.78rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.st-verified,.st-complete{background:var(--good-soft);color:var(--good)}.st-issues{background:var(--warn-soft);color:var(--warn)}
.selfq{margin-bottom:10px}.seg4{display:flex;flex-wrap:wrap;gap:6px}
.seg4 label{display:flex;gap:6px;align-items:center;background:var(--sunk);border-radius:8px;padding:6px 10px;min-height:40px;cursor:pointer;font-size:.9rem}
.pod h2{margin-bottom:4px}

.chipsinfo{display:flex;flex-wrap:wrap;gap:6px}
.rec{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:8px 0}.rec audio{width:100%;max-width:420px}.rec-b.recording{background:var(--bad)}

<script>

(function () {

    [/\bdiscuss about\b/gi, () => `«discuss about» → discuss (ohne about).`],
    [/\bexplain (me|him|her|us|them)\b/gi, (m) => `«${m}» → explain to ${m.split(" ")[1]} / explain sth. to sb.`],
    [/\bmore (better|worse|bigger|easier)\b/gi, (m) => `«${m}» → doppelte Steigerung: nur ${m.split(" ")[1]}.`],
    [/\bdid(n't| not) (went|saw|came|was|had|took|made|said)\b/gi, (m) => `«${m}» → nach did/didn't Grundform (go, see, come …).`],
    [/\bif (I|you|he|she|it|we|they|the \w+) would\b/gi, (m) => `«${m}» → im if-Satz kein would: if … had / were / did …`],
    [/\bbecome (a|an|the|some|my|his|her|their|our) (job|present|letter|answer|message|visa|grade)\b/gi, (m) => `«${m}» → False friend: bekommen = get / receive.`],
    [/\bactual (situation|debate|problem|government|news|topic)\b/gi, (m) => `«${m}» → aktuell = current (actual = tatsächlich).`],
    [/\beventually\b/gi, () => `«eventually» = schließlich. Für «eventuell» besser: possibly, perhaps, maybe.`],
    [/\b(much) (people|students|problems|things|countries|jobs)\b/gi, (m) => `«${m}» → zählbar: many ${m.split(" ")[1]}.`],
    [/\bin the (\w+ )?text (describes|shows|criticises|criticizes|presents|explains) the (author|narrator|writer)\b/gi, (m) => `«${m}» → keine deutsche Verb-zweit-Stellung: «In the text, the author describes …».`]
  ];
  const STOP = new Set("the a an and or of to in on at for with by from is are was were be been it this that these those they he she we you i his her their our its not but as so if has have had do does did will would can could should there which who what about more very also than".split(" "));
  window.checkText = function (txt, minWords, isLetter) {
    const out = []; const low = txt.toLowerCase(); const words = low.match(/[a-z']+/g) || [];
    out.push([words.length >= minWords ? "good" : "warn", `Umfang: ${words.length} Wörter (Ziel: mindestens ${minWords}).`]);
    const con = CONN.filter((c) => new RegExp("\\b" + c + "\\b").test(low));
    out.push([con.length >= 3 ? "good" : "warn", con.length ? `Linking words (${con.length}): ${con.join(", ")}.` : "Keine linking words gefunden. Verknüpfe Gedanken mit however, moreover, therefore …"]);
    const freq = {}; words.forEach((w) => { if (w.length > 3 && !STOP.has(w)) freq[w] = (freq[w] || 0) + 1; });
    const rep = Object.entries(freq).filter(([, n]) => n >= 4).map(([w, n]) => `${w} (${n}×)`);
    if (rep.length) out.push(["warn", `Wiederholungen: ${rep.join(", ")}. Nutze Synonyme oder Pronomen.`]);
    const sents = txt.split(/[.!?]+/).map((x) => x.trim()).filter(Boolean); const lens = sents.map((x) => x.split(/\s+/).length);
    if (lens.some((l) => l > 40)) out.push(["warn", "Mindestens ein Satz hat über 40 Wörter. Teile ihn für mehr Klarheit."]);
    if (sents.length >= 4 && lens.every((l) => l < 9)) out.push(["warn", "Nur sehr kurze Sätze. Variiere den Satzbau mit Relativsätzen (who, which, whose), Partizipien und Nebensätzen."]);
    if (minWords >= 150 && !/\b(if|unless) [^.]{3,60}\b(would|were|had)\b/.test(low) && !/\b(which|whose|who)\b/.test(low)) out.push(["warn", "Kaum komplexe Strukturen gefunden (if-Sätze, Relativsätze). Sie zeigen Abiturniveau im Kriterium Satzbau."]);
    ERR.forEach(([re, f]) => { const m = txt.match(re); if (m) m.slice(0, 2).forEach((x) => out.push(["bad", f(x)])); });
    if (/(^|[\s.!?])i([\s,'’])/.test(txt)) out.push(["bad", "Das Personalpronomen «I» wird immer großgeschrieben."]);
    const gb = /\b\w+(ise|isation|our)\b/.test(low) && /\b(colour|favourite|realise|organise|criticise|centre|behaviour|neighbour)\b/.test(low), us = /\b(color|favorite|realize|organize|criticize|center|behavior|neighbor)\b/.test(low);
    if (gb && us) out.push(["warn", "Britische und amerikanische Schreibweise gemischt (z. B. colour/color). Bleibe bei einer Variante."]);
    if (isLetter) {
      if (!/^\s*(dear|hi|hello|hey)\b/i.test(txt)) out.push(["warn", "Brief/E-Mail: Anrede fehlt (Dear …, / Hi …,)."]);
      const formal = /\b(yours (faithfully|sincerely)|dear (sir|madam|editor))\b/.test(low), contr = (txt.match(/\b\w+'(s|re|ve|ll|d|t)\b/g) || []).length;
      if (formal && contr > 3) out.push(["warn", "Formeller Brief mit vielen Kurzformen (it's, don't …). Im formellen Register ausschreiben."]);
      if (!/(best wishes|take care|love|cheers|yours|kind regards|best regards|all the best|see you)/i.test(txt)) out.push(["warn", "Grußformel am Ende fehlt (Best wishes, / Yours sincerely, …)."]);
    }
    return out;
  };

  };

    const ta = $("textarea", root); const up = () => { $(".wc", root).textContent = (ta.value.match(/\S+/g) || []).length + " Wörter"; S.drafts["sm" + id] = ta.value; save(); }; ta.oninput = up; up();
    $("#sm-rel", root).onclick = () => { let ok = 0, n = 0; $$(".rel input", root).forEach((c) => { n++; const r = c.dataset.r === "1"; if (c.checked === r) ok++; c.parentElement.classList.add(r ? "isrel" : "notrel"); }); $(".fb", $("#sm-rel", root).parentElement).innerHTML = `<p class="${ok === n ? "good" : "bad"}">${ok} von ${n} richtig eingeschätzt. Grün markiert = relevant, durchgestrichen = weglassen.</p>`; record("mediation", ok / n >= 0.8); };

  window.viewMock = function (root, id) {

      <section class="sec"><h2>E · Prüfungsvorbereitung</h2><p class="small">Abgedeckt: Wortschatz (${VOCAB.length}), Grammatik (${GRAMMAR.length} Themen), Lesen, Hören, Schreiben, Sprachmittlung (2 + Mini), Sprechen, Textanalyse mit Markierwerkzeug, Operatoren (${OPERATORS.SL.length + OPERATORS.SM.length + OPERATORS.HV.length}), Prüfungsstrategie, ${MOCKS.length} Probeklausuren.</p></section>

      <section class="sec"><h2>F · Responsives Design (getestet)</h2>${RESP.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Größe</th><th>Gerät</th><th>Navigation</th><th>Ergebnis</th></tr></thead><tbody>${RESP.map((r) => `<tr><td class="mono">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Noch nicht getestet.</p>`}</section>

      <section class="sec"><h2>G · Status</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Bereich</th><th>Status</th><th>Hinweis</th></tr></thead><tbody>${status.map((s) => `<tr><td>${esc(s[0])}</td><td><span class="st st-${s[1].toLowerCase()}">${s[1]}</span></td><td class="small">${esc(s[2])}</td></tr>`).join("")}</tbody></table></div></section>`;
  };

  /* ---------- Router ---------- */
  let curDay = 0;
  function route() {
    stopAudio(); if (curDay) { leaveTag(curDay); curDay = 0; }
    const hsh = (location.hash || "#heute").slice(1);
    const main = $("#main"); main.innerHTML = ""; const root = document.createElement("div"); root.className = "view"; main.appendChild(root);
    let nav = "module"; const [a, ...rest] = hsh.split("-"); const b = rest.join("-");
    try {
      if (hsh === "heute" || hsh === "") { nav = "heute"; viewHeute(root); }
      else if (hsh === "plan") { nav = "plan"; viewPlan(root); }
      else if (a === "tag") { nav = "plan"; curDay = +b; viewTag(root, +b); }
      else if (hsh === "module") viewModule(root);
      else if (hsh === "pruefung") { nav = "pruefung"; viewPruefung(root); }
      else if (a === "mock") { nav = "pruefung"; viewMock(root, b); }
      else if (hsh === "grundlagen") { nav = "grundlagen"; viewGrundlagen(root); }
      else if (a === "g") viewGramTopic(root, b);
      else if (a === "read") viewReadText(root, b);
      else if (a === "lit") viewLit(root, b);
      else if (a === "hv") viewHV(root, b);
      else if (a === "sm") viewSM(root, b);
      else if (a === "clip") viewClip(root, b);
      else if (a === "op") viewOperatoren(root, b);
      else if (a === "m") {
        ({ diag: viewDiag, vocab: viewVocab, grammar: viewGrammar, read: viewRead, listen: viewListen, write: viewWrite, mediation: viewMediation, analysis: viewAnalysis, speak: viewSpeak, culture: viewCulture, strategy: viewStrategy, operatoren: viewOperatoren, redemittel: viewRedemittel, podcast: viewPodcast, video: viewVideo, final: viewFinal }[b] || viewModule)(root);
      } else { nav = "heute"; viewHeute(root); }
    } catch (e) { root.innerHTML = `<p class="bad">Diese Ansicht konnte nicht geladen werden: ${esc(e.message)}</p><a href="#heute">Zur Startseite</a>`; console.error(e); }
    $$(".nav a").forEach((x) => x.setAttribute("aria-current", x.dataset.nav === nav ? "page" : "false"));
    const hd = $("h1", root); if (hd) { hd.tabIndex = -1; }
  }
  window.rerender = route;
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); const hd = $("#main h1"); if (hd) hd.focus({ preventScroll: true }); });
  document.addEventListener("DOMContentLoaded", () => {
    const sel = $("#kurs"); sel.value = S.kurs;
    sel.onchange = () => { S.kurs = sel.value; save(); route(); };
    route();
  });
  if (document.readyState !== "loading") { const sel = $("#kurs"); if (sel) { sel.value = S.kurs; sel.onchange = () => { S.kurs = sel.value; save(); route(); }; route(); } }
})();

</script>

<script>
(function(){
  var btn=document.getElementById('install'), deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;btn.classList.add('show');});
  btn.addEventListener('click',function(){ if(deferred){deferred.prompt();deferred.userChoice.finally(function(){deferred=null;btn.classList.remove('show');});} });
  window.addEventListener('appinstalled',function(){btn.classList.remove('show');});
  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone && navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function(){}); }
  var dismissed=false; try{dismissed=localStorage.getItem('iosbar')==='1';}catch(e){}
  if (window.isIOS && !window.NATIVE_IOS && !standalone && !dismissed && /^https?:/.test(location.protocol)) {
    var bar=document.createElement('div'); bar.className='iosbar'; bar.setAttribute('role','dialog'); bar.setAttribute('aria-label','Als App installieren');
    bar.innerHTML='<strong>Als App auf dem Home-Bildschirm</strong>Tippe auf <svg viewBox="0 0 24 24" aria-label="Teilen"><path d="M12 3v12M8 7l4-4 4 4M5 11v9h14v-9" fill="none" stroke="currentColor" stroke-width="2"/></svg> <em>Teilen</em> und dann auf <em>Zum Home-Bildschirm</em>. Danach läuft der Kurs auch offline.<button class="x" aria-label="Hinweis schließen">×</button>';
    bar.querySelector('.x').onclick=function(){bar.remove(); try{localStorage.setItem('iosbar','1');}catch(e){}};
    document.body.appendChild(bar);
  }
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      function ready(){var p=document.getElementById('offl'); if(p) p.hidden=false;}
      if(navigator.serviceWorker.controller) ready(); else navigator.serviceWorker.addEventListener('controllerchange',ready);
      reg.addEventListener('updatefound',function(){var w=reg.installing; w.addEventListener('statechange',function(){
        if(w.state==='installed' && navigator.serviceWorker.controller){
          var b=document.createElement('div'); b.className='update'; b.innerHTML='<span>Neue Version verfügbar. Dein Fortschritt bleibt erhalten.</span><button>Aktualisieren</button>';
          b.querySelector('button').onclick=function(){w.postMessage('skip'); location.reload();}; document.body.appendChild(b);
        }});});
    }).catch(function(){});
  }
})();
</script>
