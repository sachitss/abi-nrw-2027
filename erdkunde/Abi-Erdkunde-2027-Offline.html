<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}

:root{
  --paper:#F4F5F1; --surface:#FFFFFF; --sunk:#E8EBE3; --ink:#16241F; --muted:#55635D; --line:#D3D8CD;
  --red:#0B7A5E; --red-soft:#DCF1E9; --blue:#1E4DB7; --blue-soft:#E3EBFB;
  --good:#1D7446; --good-soft:#E1F3E8; --warn:#9A6200; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FCE6E3;
  --an-voc:#CFE1FF; --an-ev:#FFE39A; --an-sty:#F7C9E6; --an-arg:#C8EFD5; --an-imp:#FFD2C2;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 4px 16px rgba(21,32,51,.06);
  --r:10px; --nav:0px;
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --fb:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#0D1412;--surface:#15201C;--sunk:#1C2925;--ink:#E6EAF2;--muted:#9AA4B8;--line:#2A3A34;
  --red:#4CC39C;--red-soft:#123027;--blue:#86A8F5;--blue-soft:#1C2A48;--good:#5CCB8B;--good-soft:#16301F;--warn:#E7B458;--warn-soft:#352812;--bad:#FF8577;--bad-soft:#3A1C1A;
  --an-voc:#23406F;--an-ev:#5A4A12;--an-sty:#5B2748;--an-arg:#1D4A2F;--an-imp:#5A2E1D;--shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#0D1412;--surface:#15201C;--sunk:#1C2925;--ink:#E6EAF2;--muted:#9AA4B8;--line:#2A3A34;
  --red:#4CC39C;--red-soft:#123027;--blue:#86A8F5;--blue-soft:#1C2A48;--good:#5CCB8B;--good-soft:#16301F;--warn:#E7B458;--warn-soft:#352812;--bad:#FF8577;--bad-soft:#3A1C1A;
  --an-voc:#23406F;--an-ev:#5A4A12;--an-sty:#5B2748;--an-arg:#1D4A2F;--an-imp:#5A2E1D;--shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--fb);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:.35em 0 .7em}
a{color:var(--blue)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.small{font-size:.88rem}.muted{color:var(--muted)}
.eyebrow,.lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:.2em 0 .4em}
h1[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-inline:16px;max-width:1280px;margin:0 auto}
.brand{font-family:var(--fd);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand b{color:var(--red);position:relative}
.brand b::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-3px;height:3px;background:var(--red);border-radius:2px;transform:rotate(-2deg)}
.brand small{font-family:var(--fm);font-size:.72rem;color:var(--muted);font-weight:400}
.kurs{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.kurs select{max-width:52vw;font-size:16px}
@media (max-width:430px){.kurs .kl{display:none}.brand small{display:none}}
select,.inp,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%}
textarea{width:100%;line-height:1.6;resize:vertical}
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;text-decoration:none;color:var(--muted);font-size:.72rem;min-height:56px}
.nav a[aria-current="page"]{color:var(--red);font-weight:700}
.nav a[aria-current="page"] .ic{transform:translateY(-1px)}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
#main{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:76px;gap:4px;padding-inline:12px}
  .nav a{flex:none;flex-direction:row;gap:12px;font-size:.98rem;padding:12px 14px;border-radius:10px;min-height:48px}
  .nav a[aria-current="page"]{background:var(--red-soft)}
  .top{padding-left:0}
  body{padding-left:210px}
  #main{padding-inline:32px;padding-block:28px 60px}
  .top-in{padding-inline:32px}
}

/* Bausteine */
.panel,.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 16px}
.sec>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph h2{margin:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:middle}
.tag.off{background:var(--blue-soft);color:var(--blue)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 .95rem var(--fb);background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;text-decoration:none}

    "Einzelne Indikatoren verdecken Unterschiede innerhalb eines Landes – daher mehrdimensionale Indizes und kleinräumige Daten nutzen."],
  terms: [["Disparität", "Ungleichheit der Lebensbedingungen zwischen Räumen."], ["Indikator", "Messgröße, die einen Sachverhalt anzeigt."], ["HDI", "Human Development Index: Lebenserwartung, Bildung, Einkommen."], ["Kaufkraftparität (KKP)", "Umrechnung, die Preisunterschiede zwischen Ländern berücksichtigt."], ["Gini-Koeffizient", "Maß der Einkommensungleichheit (0 = gleich, 1 = maximal ungleich)."], ["Zentrum-Peripherie", "Gegensatz zwischen wirtschaftlichem Kernraum und abhängigen Randräumen."], ["Dependenztheorie", "Erklärt Unterentwicklung durch Abhängigkeit von Industrieländern."], ["Modernisierungstheorie", "Erklärt Entwicklung als Nachholen von Modernisierungsschritten."]],
  vis: "choropleth", cases: ["italien"],

    ["Warum rechnet man BNE in Kaufkraftparitäten?", ["Um Preisunterschiede zwischen Ländern auszugleichen", "Um Wechselkurse zu erhöhen", "Um die Bevölkerung zu zählen"], 0, "Ein Dollar kauft in verschiedenen Ländern unterschiedlich viel.", "Die anderen Optionen beschreiben keinen Zweck der KKP."],
    ["Ein Gini-Koeffizient nahe 1 bedeutet …", ["sehr ungleiche Einkommensverteilung", "sehr gleiche Verteilung", "hohes Durchschnittseinkommen"], 0, "1 = maximale Ungleichheit.", "0 wäre gleich; der Gini sagt nichts über die Höhe aus."]

{ id: "demo", if: 6, t: "Demografische Prozesse und Tragfähigkeit", short: "Demografie & Tragfähigkeit",
  goal: "Ich kann das Modell des demographischen Übergangs anwenden, Bevölkerungspyramiden auswerten und die Tragfähigkeit von Räumen beurteilen.",
  wissen: ["Das Modell des demographischen Übergangs beschreibt den Wandel von hohen zu niedrigen Geburten- und Sterberaten in fünf Phasen. Weil die Sterberate zuerst sinkt, wächst die Bevölkerung in der Übergangsphase stark.",

{ n: 1, t: "Wie analysiere ich eine Karte?", min: 5, topic: null, lvl: 2,
  text: "Willkommen beim Geographie-Abitur-Podcast. Folge eins: Wie analysiere ich eine Karte? Der wichtigste Satz vorweg: Lies zuerst den Kartenrand, dann den Karteninhalt. Titel, Legende, Maßstab, Quelle und Jahr verraten dir, was die Karte zeigen will und wie aktuell sie ist. Dann orientierst du dich: Welcher Raum ist dargestellt, wo liegt er, wie groß ist er? Nutze dafür auch deinen Atlas, denn der ist im Abitur erlaubt. Im dritten Schritt beschreibst du: Welche Verteilungen, Schwerpunkte und Gegensätze fallen auf? Nenne dabei immer Werte aus der Legende und konkrete Orte. Erst danach analysierst und erklärst du: Welche Zusammenhänge gibt es, und warum ist das so? Zum Schluss kannst du bewerten, wenn die Aufgabe es verlangt. Ein typischer Fehler ist, sofort zu erklären, ohne vorher sauber zu beschreiben. Merke dir die Reihenfolge: orientieren, beschreiben, analysieren, erklären, bewerten.",
  terms: [["Legende", "Zeichenerklärung einer Karte"], ["Maßstab", "Verhältnis von Kartenstrecke zu Naturstrecke"], ["Thematische Karte", "Karte zu einem bestimmten Sachthema"]],

{ n: 2, t: "Landwirtschaft in den Tropen", min: 5, topic: "lw_trop", lvl: 2,
  text: "Folge zwei: Landwirtschaft in den Tropen. In den Tropen treffen Subsistenzwirtschaft und Weltmarktproduktion aufeinander. Kleinbauern bauen für den Eigenbedarf an, oft im Mischanbau. Daneben gibt es Plantagen, die Cash Crops wie Palmöl, Bananen oder Kakao für den Export produzieren. Ein wichtiges Grundwissen: Tropische Böden sind meist nährstoffarm. Die Nährstoffe stecken im Regenwald vor allem in den Pflanzen. Wird gerodet, sinkt die Fruchtbarkeit schnell. Weltmarktprozesse prägen die Anbauentscheidungen: Preise schwanken, große Handelskonzerne bestimmen Standards, und die Weiterverarbeitung findet oft in den Industrieländern statt. Deshalb bleibt im Anbauland wenig Wertschöpfung. Im Abitur geht es häufig um Beurteilungen: Ist eine Plantagenwirtschaft ein Entwicklungsmotor oder eine Falle? Denke immer an die drei Dimensionen der Nachhaltigkeit: ökologisch, ökonomisch und sozial.",
  terms: [["Cash Crop", "Marktfrucht für den Export"], ["Subsistenz", "Produktion für den Eigenbedarf"], ["Wertschöpfung", "Zusätzlich geschaffener Wert"]],
  q: [["Wo stecken im Regenwald die meisten Nährstoffe?", ["In der Biomasse", "Im tiefen Boden", "Im Grundwasser"], 0, "Kurzgeschlossener Nährstoffkreislauf."], ["Was ist ein Cash Crop?", ["Marktfrucht für den Verkauf/Export", "Grundnahrungsmittel für die Familie", "Futterpflanze"], 0, "Cash = Geld."], ["Wo findet die Verarbeitung von Kakao meist statt?", ["In Industrieländern", "Auf den Kakaofeldern", "Nirgends"], 0, "Wertschöpfung wandert ab."], ["Welche Dimensionen hat Nachhaltigkeit?", ["Ökologisch, ökonomisch, sozial", "Nur ökologisch", "Politisch und militärisch"], 0, "Nachhaltigkeitsdreieck."], ["Was folgt oft auf Rodung tropischer Wälder?", ["Schneller Fruchtbarkeitsverlust", "Dauerhaft hohe Erträge ohne Dünger", "Mehr Niederschlag"], 0, "Nährstoffvorrat geht verloren."]] },
{ n: 3, t: "Globale Disparitäten", min: 5, topic: "disp", lvl: 3,
  text: "Folge drei: Globale Disparitäten. Disparitäten sind Ungleichheiten der Lebensbedingungen zwischen Räumen. Um sie zu messen, brauchen wir Indikatoren. Das Bruttonationaleinkommen pro Kopf zeigt die Wirtschaftskraft, sagt aber nichts über die Verteilung. Deshalb gibt es den Human Development Index, der Lebenserwartung, Bildung und Einkommen verbindet. Der Gini-Koeffizient misst, wie ungleich Einkommen innerhalb eines Landes verteilt sind. Wichtig für das Abitur: Unterscheide Maßstabsebenen. Es gibt globale Disparitäten zwischen Ländern, nationale innerhalb eines Landes und regionale, etwa zwischen Stadt und Land. Für die Ursachen gibt es verschiedene Theorien. Die Modernisierungstheorie sieht fehlende Modernisierung als Problem. Die Dependenztheorie betont die Abhängigkeit vom Zentrum. Gute Antworten verbinden mehrere Ursachen und belegen sie mit Material.",
  terms: [["HDI", "Index aus Lebenserwartung, Bildung, Einkommen"], ["Gini-Koeffizient", "Maß der Einkommensungleichheit"], ["Dependenztheorie", "Unterentwicklung durch Abhängigkeit"]],
  q: [["Was misst der Gini-Koeffizient?", ["Einkommensungleichheit", "Lebenserwartung", "Fläche"], 0, "0 gleich, 1 maximal ungleich."], ["Warum reicht das BNE pro Kopf allein nicht?", ["Es zeigt nicht die Verteilung", "Es ist immer falsch", "Es misst nur Bildung"], 0, "Durchschnittswert verdeckt Ungleichheit."], ["Welche Ebene beschreibt Unterschiede zwischen Stadt und Land eines Staates?", ["Regional/national", "Global", "Planetar"], 0, "Innerstaatlich."], ["Welche Theorie betont Abhängigkeit?", ["Dependenztheorie", "Modernisierungstheorie", "Standorttheorie"], 0, "Dependenz = Abhängigkeit."], ["Gute Abitur-Antworten …", ["verbinden mehrere Ursachen mit Materialbelegen", "nennen eine Ursache", "verzichten auf Belege"], 0, "Multikausal und belegt."]] },
{ n: 4, t: "Stadtentwicklung", min: 5, topic: "stadt_merk", lvl: 2,
  text: "Folge vier: Stadtentwicklung. Städte verändern sich ständig. Drei Prozesse solltest du sicher unterscheiden. Suburbanisierung: Menschen, Handel und Gewerbe ziehen ins Umland, oft wegen günstigerer Grundstücke und dank des Autos. Reurbanisierung: Die Kernstadt gewinnt wieder Einwohner, zum Beispiel junge Menschen, die kurze Wege und urbanes Leben schätzen. Gentrifizierung: Ein Viertel wird aufgewertet, Mieten steigen, und alteingesessene Bewohner werden verdrängt. Häufig beginnt das mit sogenannten Pionieren wie Studierenden und Künstlern. Stadtmodelle helfen, Strukturen einzuordnen. Die europäische Stadt hat einen historischen Kern, eine hohe Dichte und eine Mischung von Wohnen und Arbeiten. Das heutige Leitbild heißt Stadt der kurzen Wege.",
  terms: [["Suburbanisierung", "Verlagerung ins Umland"], ["Reurbanisierung", "Rückkehr in die Kernstadt"], ["Gentrifizierung", "Aufwertung mit Verdrängung"]],
  q: [["Wer steht oft am Anfang der Gentrifizierung?", ["Pioniere wie Studierende und Künstler", "Großinvestoren", "Die Stadtverwaltung"], 0, "Pionierphase."], ["Suburbanisierung bedeutet …", ["Verlagerung ins Umland", "Rückkehr in die Stadt", "Abriss von Altstädten"], 0, "Sub-urban."], ["Leitbild heute?", ["Stadt der kurzen Wege", "Autogerechte Stadt", "Funktionstrennung"], 0, "Dichte, Mischung, kurze Wege."], ["Was fördert Suburbanisierung?", ["Auto und günstige Grundstücke", "Steigende Spritpreise", "Abriss von Straßen"], 0, "Mobilität und Preise."], ["Merkmal der europäischen Stadt?", ["Historischer Kern", "Downtown-Raster", "Keine Dichte"], 0, "Altstadt."]] },
{ n: 5, t: "Klimawandel und Stadt", min: 5, topic: "stadt_klima", lvl: 3,
  text: "Folge fünf: Klimawandel und Stadt. Städte sind vom Klimawandel doppelt betroffen: Hitze und Starkregen. Die städtische Wärmeinsel entsteht, weil Beton und Asphalt Wärme speichern, weil wenig verdunstet wird und weil Verkehr und Gebäude Abwärme erzeugen. Nachts kühlt die Stadt deutlich schlechter ab als das Umland. Bei Starkregen fließt das Wasser auf versiegelten Flächen schnell ab, die Kanalisation läuft über. Die Antwort heißt blau-grüne Infrastruktur: Parks, Straßenbäume, Dachbegrünung, Wasserflächen und Entsiegelung. Das Konzept Schwammstadt will Regenwasser speichern statt ableiten. Frischluftschneisen lassen kühle Luft aus dem Umland in die Stadt. Achte im Abitur auf Zielkonflikte: Die Stadt braucht Wohnraum, aber jede neue Bebauung kann Freiflächen kosten. Eine gute Bewertung nennt deshalb Kriterien wie Wirkung, Kosten und soziale Gerechtigkeit.",
  terms: [["Wärmeinsel", "Überwärmung der Stadt"], ["Schwammstadt", "Regenwasser speichern statt ableiten"], ["Frischluftschneise", "Freifläche für Kaltluftzufuhr"]],
  q: [["Warum kühlt die Stadt nachts schlechter ab?", ["Baustoffe speichern Wärme", "Mehr Wind", "Längere Nächte"], 0, "Wärmespeicher."], ["Ziel der Schwammstadt?", ["Regenwasser speichern", "Mehr Kanäle", "Mehr Versiegelung"], 0, "Speichern, verdunsten, versickern."], ["Wozu dienen Frischluftschneisen?", ["Kühle Luft in die Stadt leiten", "Straßen verbreitern", "Lärm erzeugen"], 0, "Kaltluftabfluss."], ["Typischer Zielkonflikt?", ["Wohnraum vs. Freiflächen", "Parks vs. Kühlung", "Bäume vs. Schatten"], 0, "Nachverdichtung vs. Klima."], ["Welche Kriterien passen zur Bewertung von Maßnahmen?", ["Wirkung, Kosten, soziale Gerechtigkeit", "Farbe, Form, Größe", "Nur die Kosten"], 0, "Mehrere Kriterien offenlegen."]] },
{ n: 6, t: "Strukturwandel", min: 5, topic: "ind_struk", lvl: 2,
  text: "Folge sechs: Strukturwandel. Das Ruhrgebiet ist das Lehrbuchbeispiel. Kohle, Erz, Wasserwege und viele Arbeitskräfte machten die Region zum industriellen Herz Deutschlands. Ab Ende der fünfziger Jahre geriet die Montanindustrie in die Krise: Importkohle und Öl waren billiger, später kam globale Konkurrenz beim Stahl hinzu. Die Folgen waren Arbeitslosigkeit, Abwanderung und riesige Brachflächen. Der Strukturwandel ist ein langer Prozess. Neue Hochschulen, Dienstleistungen, Logistik, Gesundheitswirtschaft und Kultur haben die Region verändert. Aus Zechen wurden Kultur- und Freizeitorte, die Zeche Zollverein ist heute UNESCO-Welterbe. 2018 endete die Steinkohleförderung. Im Abitur unterscheidest du harte und weiche Standortfaktoren und zeigst, wie sich ihre Bedeutung wandelt.",
  terms: [["Montanindustrie", "Bergbau und Stahl"], ["Brachfläche", "Ungenutzte Industriefläche"], ["Weicher Standortfaktor", "Image, Kultur, Lebensqualität"]],
  q: [["Warum geriet die Ruhrkohle in die Krise?", ["Billigere Importkohle und Öl", "Zu wenig Arbeitskräfte", "Fehlende Kanäle"], 0, "Kostennachteil."], ["Wann endete die Steinkohleförderung im Ruhrgebiet?", ["2018", "1968", "2030"], 0, "Prosper-Haniel, Bottrop."], ["Zeche Zollverein ist heute …", ["UNESCO-Welterbe", "ein aktives Bergwerk", "ein Flughafen"], 0, "Kultur- und Erinnerungsort."], ["Ein weicher Standortfaktor ist …", ["Kulturangebot", "Autobahnanschluss", "Grundstückspreis"], 0, "Schwer messbar."], ["Strukturwandel ist …", ["ein langfristiger Prozess", "in einem Jahr abgeschlossen", "nur ein Umweltthema"], 0, "Jahrzehnte."]] },
{ n: 7, t: "Digitalisierung und Raum", min: 5, topic: "digital", lvl: 3,
  text: "Folge sieben: Digitalisierung und Raum. Digitale Infrastruktur wie Glasfaser und Mobilfunk ist heute ein harter Standortfaktor. Wo das Netz fehlt, siedeln sich Betriebe ungern an, und junge Familien ziehen weg. Man spricht von digitaler Kluft. Der Onlinehandel verändert die Städte: In vielen Innenstädten wächst der Leerstand, während an Autobahnknoten riesige Logistikzentren entstehen. Auf der letzten Meile nimmt der Lieferverkehr zu. Homeoffice verändert Pendlerströme: Viele pendeln seltener, nehmen dafür aber längere Wege in Kauf, weil das Wohnen im Umland günstiger ist. Standardisierte Dienstleistungen können sogar ins Ausland verlagert werden. Achte im Abitur darauf, Digitalisierung nicht nur als Chance oder nur als Risiko darzustellen, sondern räumlich differenziert zu argumentieren: Wer gewinnt, wer verliert, und wo?",
  terms: [["Digitale Kluft", "Ungleicher Zugang zu Netzen"], ["Letzte Meile", "Zustellung bis zur Haustür"], ["Pendlerstrom", "Weg zwischen Wohnen und Arbeit"]],

{ n: 8, t: "Tourismus", min: 5, topic: "tour", lvl: 2,
  text: "Folge acht: Tourismus. Tourismus bringt Devisen, Arbeitsplätze und Infrastruktur. Über den Multiplikatoreffekt profitieren auch Landwirtschaft, Handwerk und Bau. Aber nicht jeder Euro bleibt im Land: Die Sickerrate beschreibt den Anteil, der an ausländische Hotelketten, Fluggesellschaften oder für importierte Lebensmittel abfließt. Besonders bei All-inclusive-Angeboten bleibt vor Ort wenig hängen. Weitere Risiken sind Saisonalität, Abhängigkeit von Krisen und Umweltbelastungen wie Wasserverbrauch. Overtourism beschreibt Orte, an denen zu viele Gäste die Lebensqualität der Einheimischen beeinträchtigen. Nachhaltiger Tourismus versucht, ökologische, ökonomische und soziale Ziele zu verbinden, etwa durch Besucherlenkung, Abgaben oder Ökotourismus wie in Costa Rica. Das Lebenszyklusmodell nach Butler hilft, die Entwicklung eines Reiseziels einzuordnen.",
  terms: [["Sickerrate", "Abfluss von Einnahmen ins Ausland"], ["Overtourism", "Überlastung durch Touristen"], ["Multiplikatoreffekt", "Zusätzliche Einkommen in anderen Branchen"]],

{ n: 9, t: "Demografischer Wandel", min: 5, topic: "demo", lvl: 2,
  text: "Folge neun: Demografischer Wandel. Das Modell des demographischen Übergangs beschreibt, wie Gesellschaften von hohen zu niedrigen Geburten- und Sterberaten wechseln. Zuerst sinkt die Sterberate, etwa durch Hygiene und Medizin. Die Geburtenrate folgt erst später, wenn Bildung, Urbanisierung und soziale Sicherung zunehmen. Dazwischen wächst die Bevölkerung stark. Bevölkerungspyramiden zeigen dir auf einen Blick, wo ein Land steht: breite Basis bedeutet junge, wachsende Bevölkerung; schmale Basis und breite Mitte bedeuten Alterung. Nigeria und Japan sind gegensätzliche Beispiele. Der Begriff Tragfähigkeit fragt, wie viele Menschen ein Raum dauerhaft versorgen kann. Das hängt nicht nur von der Natur ab, sondern auch von Technik, Handel und Konsum. Denke daran: Modelle vereinfachen. Migration und Politik können den Verlauf verändern.",
  terms: [["Fertilitätsrate", "Kinder je Frau"], ["Tragfähigkeit", "Dauerhaft versorgbare Bevölkerung"], ["Urnenform", "Alternde Bevölkerung"]],

{ n: 10, t: "Die wichtigsten Operatoren", min: 6, topic: null, lvl: 3,
  text: "Folge zehn: Die wichtigsten Operatoren. Operatoren sagen dir, was du tun sollst, und sie zeigen den Anforderungsbereich. Im Anforderungsbereich eins geht es um Wiedergabe: nennen, beschreiben, darstellen, lokalisieren. Im Anforderungsbereich zwei um Anwendung und Analyse: erklären, erläutern, analysieren, vergleichen, einordnen, kennzeichnen, anwenden. Er ist laut Konstruktionsvorgaben der Schwerpunkt jeder Abituraufgabe. Im Anforderungsbereich drei um Urteil und Problemlösung: beurteilen, bewerten, Stellung nehmen, erörtern, überprüfen. Zwei Unterschiede werden oft verwechselt. Erklären verlangt Ursachen und Folgen, erläutern zusätzlich Beispiele und Belege. Beurteilen und bewerten verlangen, dass du deine Kriterien oder Wertmaßstäbe offenlegst, bevor du urteilst. Und beim Erörtern brauchst du Pro und Contra und am Ende ein schlüssiges Fazit. Lies jede Teilaufgabe zweimal und unterstreiche den Operator.",

  /* Interaktiver Kartenbaustein: Zoom, Verschieben, Ebenen, Legende, Messen, Suchen, Vergleichen */
  window.MapWidget = function (host, opts) {

      el.querySelectorAll("[data-z]").forEach((b) => b.onclick = () => { const z = b.dataset.z; if (z === "reset") { scale = 1; tx = ty = 0; } else { const f = z === "in" ? 1.35 : 1 / 1.35; const ns = Math.min(4, Math.max(1, scale * f)); tx = 500 - (500 - tx) * (ns / scale); ty = 325 - (325 - ty) * (ns / scale); scale = ns; } clamp(); apply(); });
      function clamp() { tx = Math.min(0, Math.max(1000 - 1000 * scale, tx)); ty = Math.min(0, Math.max(650 - 650 * scale, ty)); }
      function toMap(ev) { const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); return [(p.x - tx) / scale, (p.y - ty) / scale]; }
      let drag = null, moved = false; const pointers = new Map(); let pinch0 = 0;
      svg.addEventListener("pointerdown", (e) => { pointers.set(e.pointerId, e); if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch0 = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); } drag = { x: e.clientX, y: e.clientY, tx, ty }; moved = false; });
      svg.addEventListener("pointermove", (e) => {
        if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, e);
        if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); if (pinch0) { const ns = Math.min(4, Math.max(1, scale * d / pinch0)); tx = 500 - (500 - tx) * (ns / scale); ty = 325 - (325 - ty) * (ns / scale); scale = ns; pinch0 = d; clamp(); apply(); moved = true; } return; }
        if (!drag || scale === 1) return; const r = svg.getBoundingClientRect(); const k = 1000 / r.width; const dx = (e.clientX - drag.x) * k, dy = (e.clientY - drag.y) * k; if (Math.abs(dx) + Math.abs(dy) > 6) moved = true; tx = drag.tx + dx; ty = drag.ty + dy; clamp(); apply();
      });
      const up = (e) => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch0 = 0; if (pointers.size === 0) drag = null; };

        const info = (x) => `<strong>${esc(x[1])}</strong><br>Nutzung: ${esc(x[2])}<br>Nächtliche Überwärmung: +${String(x[4]).replace(".", ",")} °C<br>Grünanteil: ${x[5]} %<br>Einwohner je km²: ${x[6].toLocaleString("de-DE")}${x[7] ? `<br>Mietindex (Stadt = 100): ${x[7]}` : ""}`;
        if (opts.onPick && opts.onPick(d, t)) return;

  };

          if (ok === items.length) { const perfect = tries === items.length; $(".fb", el).innerHTML = `<p class="${perfect ? "good" : "bad"}"><strong>Fertig.</strong> ${items.length} Karten mit ${tries} Versuchen.</p>`; recordTags(tags || ["sach"], perfect); if (onDone) onDone(perfect); } }
        else { b.classList.add("shake"); setTimeout(() => b.classList.remove("shake"), 400); $(".fb", el).innerHTML = `<p class="bad">«${esc(it[0])}» gehört nicht zu «${esc(buckets[+b.dataset.b])}».${it[2] ? " Hinweis: " + esc(it[2]) : " Überlege, ob es Ursache, Folge oder Lösung ist."}</p>`; }
      }
    });
  };
  window.termQuiz = function (host, topic, n, tags) {
    const pool = TOPICS.flatMap((t) => t.terms);
    topic.terms.slice(0, n).forEach((tm, k) => {
      const others = pool.filter((x) => x[0] !== tm[0]); const d1 = others[(k * 7 + topic.id.length) % others.length], d2 = others[(k * 13 + 5) % others.length];
      MCx(host, `Welcher Fachbegriff passt? «${tm[1]}»`, [tm[0], d1[0], d2[0] === d1[0] ? others[(k + 3) % others.length][0] : d2[0]], 0, `«${tm[0]}» ist richtig.`, `«${d1[0]}» bedeutet: ${d1[1]}`, tags || ["begriffe", "afb1"]);

  window.genPlan = function (len) {

    special[Math.round(len * 0.78)] = { kind: "mock", mock: "m3" };

    const slots = []; for (let n = 1; n <= len; n++) if (!special[n] && n % 7 !== 0) slots.push(n);
    const methodsUsed = len <= 30 ? METHODS.slice(0, 4) : len <= 60 ? METHODS.slice(0, 6) : METHODS;
    // Sequenz: nach je zwei Themen ein Methodentag, Themen ggf. mehrfach (Vertiefung)

    while (seq.length < slots.length) {
      for (let k = 0; k < 2 && seq.length < slots.length; k++) { seq.push({ kind: "topic", topic: TOPICS[ti].id, pass }); ti++; if (ti === TOPICS.length) { ti = 0; pass++; } }
      if (seq.length < slots.length) { seq.push(Object.assign({}, methodsUsed[mi % methodsUsed.length])); mi++; }

  window.dayPct = (n) => Math.round((Object.keys(S.done[n] || {}).length / 12) * 100);

  /* ---- Lernzeit je Sitzungslänge ---- */
  window.sessionPlan = function (min) {

  /* ---- Rechenaufgaben ---- */
  window.calcTask = function () {
    const r = (a, b) => Math.round(a + Math.random() * (b - a)); const k = r(0, 5);
    if (k === 0) { const a = r(40, 400) * 100, b = Math.round(a * (0.5 + Math.random())); return [`Die Einwohnerzahl stieg von ${a.toLocaleString("de-DE")} auf ${b.toLocaleString("de-DE")}. Berechne die Veränderung in Prozent (1 Nachkommastelle).`, ((b - a) / a) * 100, "%", "Veränderung = (neu − alt) / alt × 100", 0.15]; }
    if (k === 1) { const p = r(20, 900) * 1000, f = r(50, 2000); return [`Eine Region hat ${p.toLocaleString("de-DE")} Einwohner auf ${f.toLocaleString("de-DE")} km². Berechne die Bevölkerungsdichte (Ew./km², ganze Zahl).`, p / f, "Ew./km²", "Dichte = Einwohner / Fläche", 1]; }
    if (k === 2) { const m = [25000, 50000, 100000, 200000][r(0, 3)], cm = r(2, 18); return [`Auf einer Karte im Maßstab 1:${m.toLocaleString("de-DE")} misst eine Strecke ${cm} cm. Wie lang ist sie in der Natur (km, 2 Nachkommastellen)?`, (cm * m) / 100000, "km", "Naturstrecke = Kartenstrecke × Maßstabszahl; 100.000 cm = 1 km", 0.01]; }
    if (k === 3) { const a = r(10, 90) * 1000, g = r(1, 6) / 2, y = r(5, 20); return [`Eine Stadt mit ${a.toLocaleString("de-DE")} Einwohnern wächst jährlich um ${String(g).replace(".", ",")} %. Wie viele Einwohner hat sie nach ${y} Jahren (ganze Zahl)?`, a * Math.pow(1 + g / 100, y), "Ew.", "N = N₀ × (1 + p/100)^t", Math.max(2, a * 0.001)]; }
    if (k === 4) { const g = [0.5, 1, 1.4, 2, 2.5, 3.5][r(0, 5)]; return [`Die Bevölkerung wächst um ${String(g).replace(".", ",")} % pro Jahr. Schätze die Verdopplungszeit mit der 70er-Regel (Jahre, 1 Nachkommastelle).`, 70 / g, "Jahre", "Verdopplungszeit ≈ 70 / Wachstumsrate in %", 0.15]; }
    const v0 = r(60, 140), v1 = r(60, 160); return [`Ein Index lag 2015 bei ${v0} und 2025 bei ${v1} (Basisjahr 2010 = 100). Um wie viel Prozent veränderte sich der Wert zwischen 2015 und 2025 (1 Nachkommastelle)?`, ((v1 - v0) / v0) * 100, "%", "Prozentuale Veränderung zwischen Indexwerten = (neu − alt) / alt × 100 – nicht einfach die Differenz der Indexpunkte", 0.15];
  };
  window.calcSet = function (b, n) {
    for (let i = 0; i < n; i++) {
      const [q, ans, unit, how, tol] = calcTask(); const id = "c" + Math.random().toString(36).slice(2, 7);
      const el = h(`<div class="ex"><label class="ex-q" for="${id}">${esc(q)}</label><div class="row"><input id="${id}" class="inp" inputmode="decimal" autocomplete="off"><span class="muted">${esc(unit)}</span><button class="btn sm">Prüfen</button></div><div class="fb" aria-live="polite"></div></div>`); b.appendChild(el);
      const go = () => { const v = parseFloat($("input", el).value.replace(/\./g, "").replace(",", ".")); if (isNaN(v) || el.dataset.done) return; el.dataset.done = 1; const ok = Math.abs(v - ans) <= tol * (unit === "%" ? 1 : 1) + Math.abs(ans) * 0.002; const shown = unit === "km" ? ans.toFixed(2) : unit === "%" || unit === "Jahre" ? ans.toFixed(1) : Math.round(ans).toLocaleString("de-DE"); $(".fb", el).innerHTML = `<p class="${ok ? "good" : "bad"}"><strong>${ok ? "Richtig." : "Noch nicht."}</strong> Ergebnis: ${String(shown).replace(".", ",")} ${esc(unit)}. Rechenweg: ${esc(how)}.</p>`; recordTags(["methoden", "diagramme"], ok, ok ? null : "Rechnen: " + q); };
      $("button", el).onclick = go; $("input", el).onkeydown = (e) => { if (e.key === "Enter") go(); };
    }
  };
})();

      <section class="sec"><h2>B · Kursstruktur</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Programm</th><th>Thementage</th><th>Verschiedene Themen</th><th>Methodentage</th><th>Wiederholung</th><th>Probeklausuren</th><th>Einstufung/Zeit/Endspurt</th></tr></thead><tbody>${plans.map((p) => `<tr>${p.map((v, i) => `<td class="mono">${i === 0 ? v + " Tage" : v + (i === 2 ? " / 16" : "")}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
      <section class="sec"><h2>C · Tagespaket</h2><ol class="small">${COMP.map((c) => `<li>${esc(c[1])}</li>`).join("")}</ol><p class="small">Lernzeit wählbar: 30, 45, 60 oder 90 Minuten (Aufteilung auf der Startseite).</p></section>
      <section class="sec"><h2>D · Multimedia</h2><ul class="small"><li>Audio: ${TOPICS.length} × 3-Minuten-Fachwissen, ${TOPICS.length} × Fachbegriffe hören</li><li>Podcast: ${PODCAST.length} Episoden</li><li>Video: ${CLIPS.length} animierte Clips</li><li>Karten: interaktive Stadtkarte (5 Ebenen), Choroplethen-, Flusskarte, Lagekarten</li><li>Diagramme: Klima (3), Pyramiden (2), Linien, Säulen, Streuung</li><li>Übungen, Karteikarten (${TOPICS.reduce((a, t) => a + t.terms.length, 0)}), Fallbeispiele (${CASES.length}), Probeklausuren (${MOCKS.length})</li></ul></section>
      <section class="sec"><h2>E · Prüfungsvorbereitung</h2><div class="tblwrap"><table class="tbl"><tbody>${[["Sach-, Methoden-, Urteils-, Handlungskompetenz", "Tracking + Übungen in jedem Tagespaket"], ["AFB I–III", "AFB-Trainer, Kennzeichnung in allen Aufgaben"], ["Operatoren", "Modul + Blitz"], ["Materialanalyse", "Modul + Tagespaket"], ["Karten / Statistiken / Diagramme", "Module"], ["Fallbeispiele", CASES.length + " Fälle"], ["Klausurtraining / Zeitmanagement", "Timer GK/LK mit eigener Aufteilung"], ["Mock-Abitur", "4 Klausuren, GK und LK"]].map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div></section>
      <section class="sec"><h2>F · Responsives Design – gemessene Größen</h2>${RESP_DIMS ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Komponente</th>${RESP_DIMS.sizes.map((s) => `<th class="mono">${s}</th>`).join("")}</tr></thead><tbody>${RESP_DIMS.rows.map((r) => `<tr><td><strong>${esc(r[0])}</strong></td>${r.slice(1).map((c) => `<td class="small mono">${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div><p class="small muted">Gerenderte Breite × Höhe in px und Position (x, y), gemessen in Chromium am ${RESP_DIMS.date}. Kein horizontales Scrollen in ${RESP_DIMS.views} Ansichten je Größe.</p>` : `<p class="muted">Noch nicht gemessen.</p>`}</section>
      <section class="sec"><h2>G · Status</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Bereich</th><th>Status</th><th>Hinweis</th></tr></thead><tbody>${status.map((s) => `<tr><td>${esc(s[0])}</td><td><span class="st st-${s[1].toLowerCase()}">${s[1]}</span></td><td class="small">${esc(s[2])}</td></tr>`).join("")}</tbody></table></div></section>`;
  };

  /* ---------- Router ---------- */
  let curDay = 0;
  function route() {
    stopAudio(); if (window._stopClock) { window._stopClock(); window._stopClock = null; } if (curDay) { leaveTag(curDay); curDay = 0; }
    const hsh = (location.hash || "#heute").slice(1); const main = $("#main"); main.innerHTML = ""; const root = document.createElement("div"); root.className = "view"; main.appendChild(root);
    const i = hsh.indexOf("-"); const a = i < 0 ? hsh : hsh.slice(0, i), b = i < 0 ? "" : hsh.slice(i + 1); let nav = "module";
    const M = { diag: viewDiag, themen: viewThemen, karten: viewKarten, diagramme: viewDiagramme, material: viewMaterial, operatoren: viewOperatoren, afb: viewAFB, begriffe: viewBegriffe, faelle: viewFaelle, rechnen: viewRechnen, schreiben: viewSchreiben, audio: viewAudio, podcast: viewPodcast, video: viewVideo, zeit: viewZeit, final: viewFinal };
    try {
      if (!hsh || hsh === "heute") { nav = "heute"; viewHeute(root); }
      else if (hsh === "plan") { nav = "plan"; viewPlan(root); }
      else if (a === "tag") { nav = "plan"; curDay = +b; viewTag(root, +b); }
      else if (hsh === "module") viewModule(root);
      else if (hsh === "pruefung") { nav = "pruefung"; viewPruefung(root); }
      else if (a === "mock") { nav = "pruefung"; viewMock(root, b); }
      else if (hsh === "grundlagen") { nav = "grundlagen"; viewGrundlagen(root); }
      else if (a === "m" && M[b]) M[b](root);
      else if (a === "t") viewTopic(root, b);
      else if (a === "fall") viewFall(root, b);
      else if (a === "clip") viewClip(root, b);
      else if (a === "op") viewOperatoren(root, b);
      else { nav = "heute"; viewHeute(root); }
    } catch (e) { root.innerHTML = `<p class="bad">Diese Ansicht konnte nicht geladen werden: ${esc(e.message)}</p><a href="#heute">Zur Startseite</a>`; console.error(e); }
    $$(".nav a").forEach((x) => x.setAttribute("aria-current", x.dataset.nav === nav ? "page" : "false"));
    if (window.STANDALONE && (["tag", "mock", "t", "fall"].includes(a) || ["m-operatoren", "m-begriffe", "m-rechnen", "m-schreiben"].includes(hsh))) { const h1 = $("h1", root); if (h1) { const pb = document.createElement("button"); pb.className = "btn sm ghost prt"; pb.type = "button"; pb.textContent = "Als Arbeitsblatt drucken / PDF"; pb.onclick = () => { $$("details", root).forEach((d) => d.open = true); const nb = window.NATIVE_IOS && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.printPage; if (nb) nb.postMessage((($("h1", root) || {}).textContent || "Arbeitsblatt").trim()); else window.print(); }; h1.parentNode.insertBefore(pb, h1); } }
    const hd = $("h1", root); if (hd) hd.tabIndex = -1;
  }
  window.rerender = route;
  window.addEventListener("hashchange", () => { route(); scrollTo(0, 0); const hd = $("#main h1"); if (hd) hd.focus({ preventScroll: true }); });
  const init = () => { const sel = $("#kurs"); sel.value = S.kurs; sel.onchange = () => { S.kurs = sel.value; save(); route(); }; route(); };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

</script>
</body>
