<link rel="apple-touch-startup-image" href="icons/splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-2048x2732.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1640x2360.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1488x2266.png" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="icons/splash/splash-1620x2160.png" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}

:root{
  --paper:#F4F5F1; --surface:#FFFFFF; --sunk:#E8EBE3; --ink:#16241F; --muted:#55635D; --line:#D3D8CD;
  --red:#0B7A5E; --red-soft:#DCF1E9; --blue:#1E4DB7; --blue-soft:#E3EBFB;
  --good:#1D7446; --good-soft:#E1F3E8; --warn:#9A6200; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FCE6E3;
  --an-voc:#CFE1FF; --an-ev:#FFE39A; --an-sty:#F7C9E6; --an-arg:#C8EFD5; --an-imp:#FFD2C2;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 4px 16px rgba(21,32,51,.06);
  --r:10px; --nav:0px;
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --fb:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#0D1412;--surface:#15201C;--sunk:#1C2925;--ink:#E6EAF2;--muted:#9AA4B8;--line:#2A3A34;
  --red:#4CC39C;--red-soft:#123027;--blue:#86A8F5;--blue-soft:#1C2A48;--good:#5CCB8B;--good-soft:#16301F;--warn:#E7B458;--warn-soft:#352812;--bad:#FF8577;--bad-soft:#3A1C1A;
  --an-voc:#23406F;--an-ev:#5A4A12;--an-sty:#5B2748;--an-arg:#1D4A2F;--an-imp:#5A2E1D;--shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#0D1412;--surface:#15201C;--sunk:#1C2925;--ink:#E6EAF2;--muted:#9AA4B8;--line:#2A3A34;
  --red:#4CC39C;--red-soft:#123027;--blue:#86A8F5;--blue-soft:#1C2A48;--good:#5CCB8B;--good-soft:#16301F;--warn:#E7B458;--warn-soft:#352812;--bad:#FF8577;--bad-soft:#3A1C1A;
  --an-voc:#23406F;--an-ev:#5A4A12;--an-sty:#5B2748;--an-arg:#1D4A2F;--an-imp:#5A2E1D;--shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--fb);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:.35em 0 .7em}
a{color:var(--blue)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.small{font-size:.88rem}.muted{color:var(--muted)}
.eyebrow,.lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:.2em 0 .4em}
h1[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-inline:16px;max-width:1280px;margin:0 auto}
.brand{font-family:var(--fd);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand b{color:var(--red);position:relative}
.brand b::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-3px;height:3px;background:var(--red);border-radius:2px;transform:rotate(-2deg)}
.brand small{font-family:var(--fm);font-size:.72rem;color:var(--muted);font-weight:400}
.kurs{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.kurs select{max-width:52vw;font-size:16px}
@media (max-width:430px){.kurs .kl{display:none}.brand small{display:none}}
select,.inp,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%}
textarea{width:100%;line-height:1.6;resize:vertical}
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;text-decoration:none;color:var(--muted);font-size:.72rem;min-height:56px}
.nav a[aria-current="page"]{color:var(--red);font-weight:700}
.nav a[aria-current="page"] .ic{transform:translateY(-1px)}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
#main{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:76px;gap:4px;padding-inline:12px}
  .nav a{flex:none;flex-direction:row;gap:12px;font-size:.98rem;padding:12px 14px;border-radius:10px;min-height:48px}
  .nav a[aria-current="page"]{background:var(--red-soft)}
  .top{padding-left:0}
  body{padding-left:210px}
  #main{padding-inline:32px;padding-block:28px 60px}
  .top-in{padding-inline:32px}
}

/* Bausteine */
.panel,.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 16px}
.sec>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph h2{margin:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:middle}
.tag.off{background:var(--blue-soft);color:var(--blue)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 .95rem var(--fb);background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;text-decoration:none}
.btn.sm{padding:8px 12px;font-size:.88rem;min-height:40px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.done{background:var(--good-soft);color:var(--good)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:.5em 0}
.row.center{justify-content:center}
.note{font-size:.88rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.note.warn{border-color:var(--warn);color:var(--warn)}
.hint{font-size:.9rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px}
.callout{display:block;background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);color:var(--ink);text-decoration:none;border-radius:var(--r);padding:14px 16px;margin-bottom:16px}
.task{font-size:1.05rem;border-left:3px solid var(--red);padding-left:12px;margin:.5em 0 .8em}
.quote{background:var(--sunk);border-radius:8px;padding:12px}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:700;margin-bottom:10px;min-height:40px}
.stars{color:var(--warn);letter-spacing:1px;font-size:.85rem;white-space:nowrap}.stars .off{color:var(--line)}
.good{color:var(--good)}.bad{color:var(--bad)}
.fb p{margin:.5em 0 0;padding:8px 10px;border-radius:8px}
.fb .good{background:var(--good-soft)}.fb .bad{background:var(--bad-soft)}

/* Heute */
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.hero h1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big{font-size:clamp(2.6rem,9vw,4rem);color:var(--red);font-weight:600;line-height:1}
.ring{--p:0;width:112px;height:112px;flex:none;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-content:center;text-align:center;position:relative}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--paper)}
.ring>*{position:relative}.ring span{font-size:1.5rem;font-weight:600}.ring small{font-size:.7rem;color:var(--muted)}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.grid2>.panel{margin:0}
.daycard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--sunk);border-radius:10px;padding:12px 14px}
.dc-n{grid-row:1/3;font-size:.8rem;color:var(--red);font-weight:600;writing-mode:horizontal-tb}
.dc-t{font-family:var(--fd);font-weight:700;font-size:1.1rem}.dc-s{grid-column:2;font-size:.85rem}
.dc-p{grid-row:1/3;grid-column:3}.daycard .bar{grid-column:1/4;margin-top:8px}
.bar{display:block;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.daycard .bar{background:var(--surface)}
.bar>span{display:block;height:100%;background:var(--blue);border-radius:99px}
.b-good{background:var(--good)!important}.b-warn{background:var(--warn)!important}.b-bad{background:var(--bad)!important}
.recs{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px;font-size:.92rem}
.recs li{display:flex;gap:8px;align-items:baseline}
.sev{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transform:translateY(1px)}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}
.skills{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.skills li{display:grid;grid-template-columns:minmax(0,10.5em) minmax(40px,1fr) 3em;gap:10px;align-items:center;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:0 0 16px}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
.stats.mini>div{background:var(--sunk);border:0}
.big2{font-size:1.5rem;color:var(--ink);font-weight:600}
.badges{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.badges li{border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;font-size:.82rem;color:var(--muted)}
.badges li strong{color:var(--muted)}
.badges li.on{border:1.5px solid var(--red);background:var(--red-soft)}.badges li.on strong{color:var(--ink)}

/* Plan */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:6px 0 10px}
.seg.sm{display:inline-flex;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.seg button{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:44px}
.seg.sm button{border:0;border-radius:0;padding:8px 12px;font-size:.88rem;border-right:1px solid var(--line)}
.seg button small{color:var(--muted);font-size:.78rem}
.seg button[aria-checked="true"]{border-color:var(--red);background:var(--red-soft)}
.seg.sm button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:10px 0}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.p1,.dl.ph-1 .dn{background:var(--blue-soft);color:var(--blue)}.lg.p2,.dl.ph-2 .dn{background:var(--warn-soft);color:var(--warn)}.lg.p3,.dl.ph-3 .dn{background:var(--red-soft);color:var(--red)}
.lg.mk{background:var(--ink)}
.daylist{list-style:none;padding:0;margin:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-decoration:none;color:var(--ink);min-height:52px}
.dn{font-size:.8rem;font-weight:600;padding:4px 6px;border-radius:6px}
.dl.mock .dn{background:var(--ink)!important;color:var(--paper)!important}
.dt{font-weight:700;font-size:.95rem;display:flex;flex-direction:column;min-width:0}
.dt small{font-weight:400;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp{font-size:.78rem;color:var(--muted)}

/* Tag */
.dayhead{margin-bottom:14px}
.mcard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 8px}
@media (min-width:700px){.mcard{grid-template-columns:repeat(6,minmax(0,1fr))}}
.mc{min-width:0;overflow-wrap:break-word}
.mc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--muted);font-size:.74rem;text-align:center;min-height:64px}
.mc.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.qbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qbar span{font-family:var(--fm);font-size:.72rem;text-align:center;padding:4px 0;border-radius:6px;background:var(--sunk);color:var(--muted)}
.qbar span.on{background:var(--ink);color:var(--paper)}
.sec .mark{margin-top:10px}
.sh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);margin-bottom:10px}
.daynav{display:flex;justify-content:space-between;margin-top:10px}
.vl{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:6px}
.vl li{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.vl li:has(> :nth-child(2):last-child){grid-template-columns:1fr 1fr}
.vl li>*{min-width:0;overflow-wrap:anywhere}
.vl em{display:block;font-size:.84rem;color:var(--muted)}
@media (max-width:520px){.vl li{grid-template-columns:auto 1fr auto}.vl li>span:nth-child(3){grid-column:2}.vl li:has(> :nth-child(2):last-child){grid-template-columns:1fr}}
.say{border:0;background:var(--sunk);color:var(--ink);border-radius:50%;width:36px;height:36px;display:inline-grid;place-content:center;cursor:pointer;flex:none;margin-right:6px;vertical-align:middle}
.btn.say{width:auto;border-radius:8px;height:auto;margin:0}
.exl{padding-left:0;list-style:none}.exl li{margin:4px 0}
.gsteps{display:grid;gap:12px}
.gsteps>div{border-left:3px solid var(--line);padding-left:12px}
.err{text-decoration:line-through wavy var(--red);text-decoration-thickness:1px}
.sol{color:var(--good);font-weight:700}
.rm{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rm li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.rm em{color:var(--muted);font-size:.9rem}
.wrongl{padding-left:1.2em}.wrongl li{margin:3px 0}

/* Übungen */
.ex{border-top:1px dashed var(--line);padding-top:10px;margin:10px 0;border-left:0;border-right:0;border-bottom:0;padding-inline:0}
.ex-q{font-weight:700;display:block;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.opt:disabled{cursor:default;opacity:1}
.radio{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;min-height:46px;cursor:pointer}
.radio input{width:20px;height:20px;flex:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-col{display:grid;gap:8px;align-content:start}
.m-l,.m-r,.chip{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:46px;cursor:pointer;text-align:left}
.m-l.sel{border-color:var(--blue);background:var(--blue-soft)}
.m-l.right,.m-r.right{border-color:var(--good);background:var(--good-soft)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 12px}.chip:disabled{opacity:.3}
.built{min-height:48px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-weight:700}
.inp{flex:1;min-width:0}
.timer{display:inline-flex;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:6px 6px 6px 12px}
.t-l{font-size:.82rem;color:var(--muted)}.t-v{font-size:1.1rem;font-weight:600}
.timer.low .t-v{color:var(--warn)}.timer.end .t-v{color:var(--bad)}

@page{margin:15mm}@media print{.top,.nav,.foot,.prt,.back,.iosbar,.update,.install,.map-tools,.seg,.player button{display:none!important}body,.app,main,#main{background:#fff!important;color:#000!important;margin:0!important;padding:0!important;display:block!important}.sec,.panel,.card{break-inside:avoid;box-shadow:none!important;border-color:#999!important}textarea{min-height:12em}}


.install{display:none;font:700 .85rem var(--fb);background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.install.show{display:inline-flex;align-items:center}
.offline-pill{font:600 .72rem var(--fm);color:var(--good);background:var(--good-soft);border-radius:99px;padding:3px 8px;white-space:nowrap}
.update{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.update button{font:700 .9rem var(--fb);background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;min-height:40px}
@media (min-width:900px){.update{left:auto;right:24px;bottom:24px;max-width:420px}}
@media (display-mode:standalone){.install{display:none!important}}
.iosbar{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--surface);color:var(--ink);border:1.5px solid var(--red);border-radius:14px;padding:12px 44px 12px 14px;box-shadow:0 8px 30px rgba(22,36,31,.18);font-size:.95rem}
.iosbar strong{display:block;font-family:var(--fd);font-size:1.05rem;margin-bottom:2px}
.iosbar .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:50%;background:var(--sunk);color:var(--ink);font-size:1.1rem;cursor:pointer}
.iosbar svg{width:18px;height:18px;vertical-align:-3px;color:var(--blue)}
@media (min-width:900px){.iosbar{left:auto;right:24px;bottom:24px;max-width:400px}}
@supports (-webkit-touch-callout:none){select,input,textarea{font-size:max(16px,1em)!important}}
@media (max-width:520px){.offline-pill{display:none}.install{padding:6px 10px;font-size:.8rem}.top-in{gap:8px}.brand{font-size:1rem}}

<script>
(function(){
  var btn=document.getElementById('install'), deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;btn.classList.add('show');});
  btn.addEventListener('click',function(){ if(deferred){deferred.prompt();deferred.userChoice.finally(function(){deferred=null;btn.classList.remove('show');});} });
  window.addEventListener('appinstalled',function(){btn.classList.remove('show');});
  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone && navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function(){}); }
  var dismissed=false; try{dismissed=localStorage.getItem('iosbar')==='1';}catch(e){}
  if (window.isIOS && !window.NATIVE_IOS && !standalone && !dismissed && /^https?:/.test(location.protocol)) {
    var bar=document.createElement('div'); bar.className='iosbar'; bar.setAttribute('role','dialog'); bar.setAttribute('aria-label','Als App installieren');
    bar.innerHTML='<strong>Als App auf dem Home-Bildschirm</strong>Tippe auf <svg viewBox="0 0 24 24" aria-label="Teilen"><path d="M12 3v12M8 7l4-4 4 4M5 11v9h14v-9" fill="none" stroke="currentColor" stroke-width="2"/></svg> <em>Teilen</em> und dann auf <em>Zum Home-Bildschirm</em>. Danach läuft der Kurs auch offline.<button class="x" aria-label="Hinweis schließen">×</button>';
    bar.querySelector('.x').onclick=function(){bar.remove(); try{localStorage.setItem('iosbar','1');}catch(e){}};
    document.body.appendChild(bar);
  }
  if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      function ready(){var p=document.getElementById('offl'); if(p) p.hidden=false;}
      if(navigator.serviceWorker.controller) ready(); else navigator.serviceWorker.addEventListener('controllerchange',ready);
      reg.addEventListener('updatefound',function(){var w=reg.installing; w.addEventListener('statechange',function(){
        if(w.state==='installed' && navigator.serviceWorker.controller){
          var b=document.createElement('div'); b.className='update'; b.innerHTML='<span>Neue Version verfügbar. Dein Fortschritt bleibt erhalten.</span><button>Aktualisieren</button>';
          b.querySelector('button').onclick=function(){w.postMessage('skip'); location.reload();}; document.body.appendChild(b);
        }});});
    }).catch(function(){});
  }
})();
</script>
