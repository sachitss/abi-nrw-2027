<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0} [hidden]{display:none!important} img{max-width:100%}

:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#152033; --muted:#566178; --line:#D5DBE5;
  --red:#C2362B; --red-soft:#FBE7E4; --blue:#1E4DB7; --blue-soft:#E3EBFB;
  --good:#1D7446; --good-soft:#E1F3E8; --warn:#9A6200; --warn-soft:#FBF0D9; --bad:#B42318; --bad-soft:#FCE6E3;
  --an-voc:#CFE1FF; --an-ev:#FFE39A; --an-sty:#F7C9E6; --an-arg:#C8EFD5; --an-imp:#FFD2C2;
  --shadow:0 1px 2px rgba(21,32,51,.06),0 4px 16px rgba(21,32,51,.06);
  --r:10px; --nav:0px;
  --fd:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --fb:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--paper:#0E131C;--surface:#161D2A;--sunk:#1D2535;--ink:#E6EAF2;--muted:#9AA4B8;--line:#2A3448;
  --red:#F2685C;--red-soft:#3A1D1D;--blue:#86A8F5;--blue-soft:#1C2A48;--good:#5CCB8B;--good-soft:#16301F;--warn:#E7B458;--warn-soft:#352812;--bad:#FF8577;--bad-soft:#3A1C1A;
  --an-voc:#23406F;--an-ev:#5A4A12;--an-sty:#5B2748;--an-arg:#1D4A2F;--an-imp:#5A2E1D;--shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;--paper:#0E131C;--surface:#161D2A;--sunk:#1D2535;--ink:#E6EAF2;--muted:#9AA4B8;--line:#2A3448;
  --red:#F2685C;--red-soft:#3A1D1D;--blue:#86A8F5;--blue-soft:#1C2A48;--good:#5CCB8B;--good-soft:#16301F;--warn:#E7B458;--warn-soft:#352812;--bad:#FF8577;--bad-soft:#3A1C1A;
  --an-voc:#23406F;--an-ev:#5A4A12;--an-sty:#5B2748;--an-arg:#1D4A2F;--an-imp:#5A2E1D;--shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--fb);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.15;text-wrap:balance;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:800}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:.35em 0 .7em}
a{color:var(--blue)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.small{font-size:.88rem}.muted{color:var(--muted)}
.eyebrow,.lbl{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:.2em 0 .4em}
h1[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-inline:16px;max-width:1280px;margin:0 auto}
.brand{font-family:var(--fd);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.brand b{color:var(--red);position:relative}
.brand b::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-3px;height:3px;background:var(--red);border-radius:2px;transform:rotate(-2deg)}
.brand small{font-family:var(--fm);font-size:.72rem;color:var(--muted);font-weight:400}
.kurs{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.kurs select{max-width:52vw;font-size:16px}
@media (max-width:430px){.kurs .kl{display:none}.brand small{display:none}}
select,.inp,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-height:44px;max-width:100%}
textarea{width:100%;line-height:1.6;resize:vertical}
.nav{position:fixed;z-index:30;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;text-decoration:none;color:var(--muted);font-size:.72rem;min-height:56px}
.nav a[aria-current="page"]{color:var(--red);font-weight:700}
.nav a[aria-current="page"] .ic{transform:translateY(-1px)}
.ic{width:22px;height:22px;flex:none;vertical-align:middle}
#main{max-width:1060px;margin:0 auto;padding-inline:16px;padding-block:18px calc(90px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .nav{top:0;bottom:0;right:auto;width:210px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:76px;gap:4px;padding-inline:12px}
  .nav a{flex:none;flex-direction:row;gap:12px;font-size:.98rem;padding:12px 14px;border-radius:10px;min-height:48px}
  .nav a[aria-current="page"]{background:var(--red-soft)}
  .top{padding-left:0}
  body{padding-left:210px}
  #main{padding-inline:32px;padding-block:28px 60px}
  .top-in{padding-inline:32px}
}

/* Bausteine */
.panel,.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 16px}
.sec>h2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph h2{margin:0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);vertical-align:middle}
.tag.off{background:var(--blue-soft);color:var(--blue)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 .95rem var(--fb);background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:10px 16px;min-height:44px;cursor:pointer;text-decoration:none}

/* Heute */
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}

.ring{--p:0;width:112px;height:112px;flex:none;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-content:center;text-align:center;position:relative}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--paper)}
.ring>*{position:relative}.ring span{font-size:1.5rem;font-weight:600}.ring small{font-size:.7rem;color:var(--muted)}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}

.grid2>.panel{margin:0}
.daycard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--sunk);border-radius:10px;padding:12px 14px}
.dc-n{grid-row:1/3;font-size:.8rem;color:var(--red);font-weight:600;writing-mode:horizontal-tb}

.dc-p{grid-row:1/3;grid-column:3}.daycard .bar{grid-column:1/4;margin-top:8px}
.bar{display:block;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.daycard .bar{background:var(--surface)}
.bar>span{display:block;height:100%;background:var(--blue);border-radius:99px}
.b-good{background:var(--good)!important}.b-warn{background:var(--warn)!important}.b-bad{background:var(--bad)!important}
.recs{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px;font-size:.92rem}
.recs li{display:flex;gap:8px;align-items:baseline}
.sev{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transform:translateY(1px)}
.sev.bad{background:var(--bad)}.sev.warn{background:var(--warn)}
.skills{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.skills li{display:grid;grid-template-columns:8.5em 1fr 3em;gap:10px;align-items:center;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:0 0 16px}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
.stats.mini>div{background:var(--sunk);border:0}
.big2{font-size:1.5rem;color:var(--ink);font-weight:600}
.badges{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.badges li{border:1.5px dashed var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;font-size:.82rem;color:var(--muted)}
.badges li strong{color:var(--muted)}
.badges li.on{border:1.5px solid var(--red);background:var(--red-soft)}.badges li.on strong{color:var(--ink)}

/* Plan */
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:6px 0 10px}
.seg.sm{display:inline-flex;gap:0;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;margin:0}
.seg button{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;min-height:44px}
.seg.sm button{border:0;border-radius:0;padding:8px 12px;font-size:.88rem;border-right:1px solid var(--line)}
.seg button small{color:var(--muted);font-size:.78rem}
.seg button[aria-checked="true"]{border-color:var(--red);background:var(--red-soft)}
.seg.sm button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin:10px 0}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lg.p1,.dl.ph-1 .dn{background:var(--blue-soft);color:var(--blue)}.lg.p2,.dl.ph-2 .dn{background:var(--warn-soft);color:var(--warn)}.lg.p3,.dl.ph-3 .dn{background:var(--red-soft);color:var(--red)}

.daylist{list-style:none;padding:0;margin:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.dl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-decoration:none;color:var(--ink);min-height:52px}

.dt{font-weight:700;font-size:.95rem;display:flex;flex-direction:column;min-width:0}
.dt small{font-weight:400;color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dp{font-size:.78rem;color:var(--muted)}

/* Tag */
.dayhead{margin-bottom:14px}
.mcard{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 8px}

.mc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--muted);font-size:.74rem;text-align:center;min-height:64px}

.sec .mark{margin-top:10px}

.daynav{display:flex;justify-content:space-between;margin-top:10px}
.vl{list-style:none;padding:0;margin:0 0 8px;display:grid;gap:6px}

.exl{padding-left:0;list-style:none}.exl li{margin:4px 0}

.rm{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rm li{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.rm em{color:var(--muted);font-size:.9rem}
.wrongl{padding-left:1.2em}.wrongl li{margin:3px 0}

/* Übungen */
.ex{border-top:1px dashed var(--line);padding-top:10px;margin:10px 0;border-left:0;border-right:0;border-bottom:0;padding-inline:0}
.ex-q{font-weight:700;display:block;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--ink)}
.opt:disabled{cursor:default;opacity:1}
.radio{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;margin:6px 0;min-height:46px;cursor:pointer}
.radio input{width:20px;height:20px;flex:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-col{display:grid;gap:8px;align-content:start}
.m-l,.m-r,.chip{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:46px;cursor:pointer;text-align:left}
.m-l.sel{border-color:var(--blue);background:var(--blue-soft)}
.m-l.right,.m-r.right{border-color:var(--good);background:var(--good-soft)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:8px 12px}.chip:disabled{opacity:.3}
.built{min-height:48px;border:1.5px dashed var(--line);border-radius:10px;padding:10px;font-weight:700}
.inp{flex:1;min-width:0}
.timer{display:inline-flex;align-items:center;gap:10px;background:var(--sunk);border-radius:10px;padding:6px 6px 6px 12px}
.t-l{font-size:.82rem;color:var(--muted)}.t-v{font-size:1.1rem;font-weight:600}

.checks{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;background:var(--sunk);cursor:pointer;min-height:44px}
.checks input{width:20px;height:20px;flex:none;margin-top:2px}
.checks label.isrel{background:var(--good-soft)}.checks label.notrel{text-decoration:line-through;opacity:.7}
.fbl{list-style:none;padding:0;margin:6px 0;display:grid;gap:6px;font-size:.92rem}
.fbl li{padding:8px 10px;border-radius:8px;border-left:4px solid var(--line);background:var(--sunk)}
.fbl li.good{border-color:var(--good);color:var(--ink)}.fbl li.warn{border-color:var(--warn);color:var(--ink)}.fbl li.bad{border-color:var(--bad);color:var(--ink)}

/* Player */
.player{background:var(--sunk);border-radius:12px;padding:12px;margin:8px 0}
.p-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-btn{font:600 .85rem var(--fm);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:50%;width:46px;height:46px;cursor:pointer;display:grid;place-content:center}
.p-main{width:56px;height:56px;background:var(--red);color:#fff;border:0}
.p-speed{display:flex;margin-left:auto;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.p-speed button{font:600 .8rem var(--fm);background:var(--surface);color:var(--ink);border:0;border-right:1px solid var(--line);padding:0 9px;min-height:40px;cursor:pointer}
.p-speed button:last-child{border-right:0}
.p-speed button[aria-checked="true"]{background:var(--ink);color:var(--paper)}
.p-bar{height:12px;background:var(--surface);border-radius:99px;margin:12px 0 4px;cursor:pointer;overflow:hidden;border:1px solid var(--line)}

.p-time{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}

.p-lines span.now{background:var(--an-ev);border-radius:4px}

/* Module */
.modgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:0 0 16px}
.mod{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);min-height:96px}

.mod strong{font-family:var(--fd);font-size:1.05rem}.mod span{font-size:.84rem;color:var(--muted)}
.mod:hover{border-color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:12px}
.filters label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:2px;min-width:0;flex:1 1 200px}
.filters select{width:100%}
.flash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;width:100%;min-height:200px;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-bottom:4px solid var(--red);border-radius:14px;padding:20px;cursor:pointer;margin:8px 0 12px}
.f-front,.f-back>span{font-family:var(--fd);font-size:clamp(1.4rem,5vw,2rem);font-weight:700;text-align:center}
.f-back{display:flex;flex-direction:column;align-items:center;gap:6px}.f-back[hidden]{display:none}
.f-back em{color:var(--muted);text-align:center}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}

.glist{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:8px}
.glist a>*{min-width:0}
.glist a{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-decoration:none;color:var(--ink);font-weight:700;min-height:48px}
.warnsec{border-color:var(--warn);background:var(--warn-soft)}
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.op{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.92rem}

.split{display:grid;gap:16px}

.text{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 44px;font-size:1.02rem;line-height:1.75;max-width:68ch}

.ln{position:absolute;left:-32px;top:.2em;font-size:.72rem;color:var(--muted)}
.text.src{padding-left:16px}
.s{border-radius:4px;cursor:pointer;padding:1px 0}
.s:hover{background:var(--sunk)}
.hl-good{background:var(--good-soft)!important;outline:2px solid var(--good)}.hl-bad{background:var(--bad-soft)!important}
.an-voc{background:var(--an-voc)}.an-ev{background:var(--an-ev)}.an-sty{background:var(--an-sty)}.an-arg{background:var(--an-arg)}.an-imp{background:var(--an-imp)}
.s.an-voc,.s.an-ev,.s.an-sty,.s.an-arg,.s.an-imp{color:var(--ink)}
.annobar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.annobar button[role=radio]{font:700 .85rem var(--fb);color:var(--ink);border:2px solid transparent;border-radius:8px;padding:8px 12px;min-height:42px;cursor:pointer}
.annobar button[aria-checked="true"]{border-color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.steps{padding-left:1.3em}.steps>li{margin-bottom:14px}.steps>li::marker{font-family:var(--fm);color:var(--red);font-weight:600}
.stage{background:var(--ink);color:var(--paper);border-radius:14px;padding:22px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;margin:10px 0}
.slide h2{font-size:1.5rem;color:var(--paper)}.slide ul{font-size:1.08rem;padding-left:1.2em}
.slide.in{animation:fi .45s ease}@keyframes fi{from{opacity:.3;transform:translateY(6px)}}
.subs{background:rgba(0,0,0,.35);border-radius:8px;padding:8px 12px;font-size:.98rem}
.subs p{margin:2px 0}.subs p[lang=de]{opacity:.85;font-style:italic}
.cgrid,.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface)}
.card.dim{opacity:.6}
.timeline{display:flex;gap:4px;border-radius:10px;overflow:hidden;margin:10px 0}
.timeline>div{padding:10px;display:flex;flex-direction:column;gap:2px;font-size:.82rem;min-width:0}
.timeline strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-HV{background:var(--blue-soft);color:var(--blue)}.tl-SM{background:var(--warn-soft);color:var(--warn)}.tl-SL{background:var(--red-soft);color:var(--red)}
.strat{padding-left:1.4em}.strat li{margin-bottom:8px}.strat li::marker{font-family:var(--fm);color:var(--red)}

.rules dt{font-weight:700;margin-top:8px}.rules dd{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.infog{margin:0 0 8px;background:var(--sunk);border-radius:10px;padding:12px}

.letter{white-space:pre-wrap;font:1rem/1.6 var(--fb);background:var(--sunk);padding:14px;border-radius:10px}
.rgrid{display:grid;gap:4px}
.rrow{display:grid;grid-template-columns:1fr 120px 4em;gap:10px;align-items:center;font-size:.86rem;padding:4px 0;border-bottom:1px solid var(--line)}

.rrow input{width:100%;accent-color:var(--red);min-height:32px}
.rsum{font-size:1.05rem;margin-top:8px}
.hvbox{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.tk.alt{opacity:.95}
.st{font-size:.78rem;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.st-verified,.st-complete{background:var(--good-soft);color:var(--good)}.st-issues{background:var(--warn-soft);color:var(--warn)}
.selfq{margin-bottom:10px}.seg4{display:flex;flex-wrap:wrap;gap:6px}
.seg4 label{display:flex;gap:6px;align-items:center;background:var(--sunk);border-radius:8px;padding:6px 10px;min-height:40px;cursor:pointer;font-size:.9rem}
.pod h2{margin-bottom:4px}

.chipsinfo{display:flex;flex-wrap:wrap;gap:6px}
.rec{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:8px 0}.rec audio{width:100%;max-width:420px}.rec-b.recording{background:var(--bad)}

.install{display:none;font:700 .85rem var(--fb);background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.install.show{display:inline-flex;align-items:center}
.offline-pill{font:600 .72rem var(--fm);color:var(--good);background:var(--good-soft);border-radius:99px;padding:3px 8px;white-space:nowrap}
.update{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
.update button{font:700 .9rem var(--fb);background:var(--red);color:#fff;border:0;border-radius:8px;padding:8px 12px;min-height:40px}
@media (min-width:900px){.update{left:auto;right:24px;bottom:24px;max-width:420px}}
@media (display-mode:standalone){.install{display:none!important}}
.iosbar{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--surface);color:var(--ink);border:1.5px solid var(--red);border-radius:14px;padding:12px 44px 12px 14px;box-shadow:0 8px 30px rgba(21,32,51,.18);font-size:.95rem}
.iosbar strong{display:block;font-family:var(--fd);font-size:1.05rem;margin-bottom:2px}
.iosbar .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;border-radius:50%;background:var(--sunk);color:var(--ink);font-size:1.1rem;cursor:pointer}
.iosbar svg{width:18px;height:18px;vertical-align:-3px;color:var(--blue)}
@media (min-width:900px){.iosbar{left:auto;right:24px;bottom:24px;max-width:400px}}
@supports (-webkit-touch-callout:none){select,input,textarea{font-size:max(16px,1em)!important}}
@media (max-width:520px){.offline-pill{display:none}.install{padding:6px 10px;font-size:.8rem}.top-in{gap:8px}.brand{font-size:1rem}}

    host.appendChild(el);

    el.addEventListener("click", (e) => {
      const l = e.target.closest(".m-l"), r = e.target.closest(".m-r");

  window.Order = function (host, sentence, de, onDone, meta) {

  window.isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  window.dl = function (name, data, type) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: type || "text/plain;charset=utf-8" });

    if (bridge) { // native iOS-App: Datei an das Teilen-Menü übergeben
      const r = new FileReader(); r.onload = () => bridge.postMessage({ name, mime: blob.type || "application/octet-stream", data: String(r.result).split(",")[1] }); r.readAsDataURL(blob); return;
    }
    if (window.isIOS && navigator.canShare) { // Safari / Home-Bildschirm-App: Teilen-Menü (Dateien sichern)
      try { const f = new File([blob], name, { type: blob.type }); if (navigator.canShare({ files: [f] })) { navigator.share({ files: [f], title: name }).catch(() => {}); return; } } catch (e) {}
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
  window.canRecord = () => !!(window.STANDALONE && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  window.Recorder = function (host) {
    const el = h(`<div class="rec"><button class="btn sm rec-b">${icon("mic")} Aufnahme starten</button><span class="small muted rec-s"></span><div class="rec-out"></div></div>`);
    host.appendChild(el); let mr = null, parts = [], t0 = 0, iv = null;
    const b = $(".rec-b", el), st = $(".rec-s", el), out = $(".rec-out", el);
    b.onclick = async () => {
      if (mr && mr.state === "recording") { mr.stop(); return; }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        parts = []; mr = new MediaRecorder(stream); mr.ondataavailable = (e) => parts.push(e.data);
        mr.onstop = () => { stream.getTracks().forEach((t) => t.stop()); clearInterval(iv); const blob = new Blob(parts, { type: mr.mimeType || "audio/webm" }); const url = URL.createObjectURL(blob); const ext = (mr.mimeType || "").includes("mp4") ? "m4a" : "webm";
          out.innerHTML = `<audio controls src="${url}"></audio><button class="btn sm ghost rec-dl">Aufnahme speichern</button>`; $(".rec-dl", out).onclick = () => dl("sprechen-" + today() + "." + ext, blob);
          b.innerHTML = icon("mic") + " Neue Aufnahme"; b.classList.remove("recording"); st.textContent = "Hör dich an und nutze dann den Selbstcheck."; };
        mr.start(); t0 = Date.now(); b.innerHTML = icon("pause") + " Aufnahme stoppen"; b.classList.add("recording");
        iv = setInterval(() => { st.textContent = "Aufnahme läuft · " + fmt((Date.now() - t0) / 1000); }, 500);
      } catch (e) { st.textContent = "Kein Zugriff auf das Mikrofon. Erlaube den Zugriff in den Browser-Einstellungen."; }
    };
  };

  /* ---- Timer ---- */
  window.Timer = function (host, sec, label, onEnd) {
    const el = h(`<div class="timer" role="timer" aria-live="off"><span class="t-l">${esc(label)}</span><span class="t-v mono">${fmt(sec)}</span><button class="btn sm ghost">Start</button></div>`);
    host.appendChild(el); let left = sec, iv = null;
    const btn = $("button", el), v = $(".t-v", el);
    function tick() { left--; v.textContent = fmt(Math.max(0, left)); if (left <= 60) el.classList.add("low"); if (left <= 0) { clearInterval(iv); iv = null; btn.textContent = "Neu"; el.classList.add("end"); if (onEnd) onEnd(); } }
    btn.onclick = () => { if (iv) { clearInterval(iv); iv = null; btn.textContent = "Weiter"; } else { if (left <= 0) { left = sec; el.classList.remove("end", "low"); } iv = setInterval(tick, 1000); btn.textContent = "Pause"; } };
    return { el, start() { if (!iv) btn.click(); }, stop() { if (iv) { clearInterval(iv); iv = null; } } };
  };

      <p class="muted small">Noch ${dte} Tage bis zur Klausur. Die Themen folgen den Fokussierungen 2027 für den ${esc(O.kurse[S.kurs].name)}${O.kurse[S.kurs].hv ? "" : " (ohne Hörverstehen, wie für neu einsetzende Kurse vorgesehen)"}.</p>
    </div>

    <ol class="daylist">${days.map((d) => `<li><a href="#tag-${d.n}" class="dl ${d.kind} ph-${d.phase === "Grundlagen" ? 1 : d.phase === "Vertiefung" ? 2 : 3}">
      <span class="mono dn">${String(d.n).padStart(2, "0")}</span><span class="dt">${esc(d.title)}<small>${esc(d.sub || "")}</small></span><span class="dp mono">${dayPct(d.n)}%</span></a></li>`).join("")}</ol>`;
    $$("[data-len]", root).forEach((b) => b.onclick = () => { S.planLen = +b.dataset.len; save(); rerender(); });

  /* ---------- TAG ---------- */
  let dayStart = 0;
  window.viewTag = function (root, n) {
    const days = planDays(); const d = days.find((x) => x.n === n) || days[0]; n = d.n;

      <div class="mcard" aria-label="Lernkarte">${COMP.map(([k, l, ic]) => `<a href="#sec-${k}" class="mc ${doneMap[k] ? "on" : ""}" data-k="${k}">${icon(ic)}<span>${l}</span></a>`).join("")}</div>
      <div class="qbar" aria-label="Fortschritt ${dayPct(n)} Prozent">${[0, 25, 50, 75, 100].map((q) => `<span class="${dayPct(n) >= q ? "on" : ""}">${q}%</span>`).join("")}</div>
    </header>
    <div class="secs"></div>
    <nav class="daynav">${n > 1 ? `<a class="btn ghost" href="#tag-${n - 1}">${icon("back")} Tag ${n - 1}</a>` : "<span></span>"}${n < days.length ? `<a class="btn" href="#tag-${n + 1}">Tag ${n + 1} →</a>` : ""}</nav>`;
    const secs = $(".secs", root);
    function sec(k, title, mins, fill) {
      const s = h(`<section class="sec" id="sec-${k}"><div class="sh"><h2>${title}</h2><span class="muted small mono">${mins}</span></div><div class="sb"></div>
        <button class="btn sm ${doneMap[k] ? "done" : "ghost"} mark" data-k="${k}">${doneMap[k] ? icon("check") + " Erledigt" : "Als erledigt markieren"}</button></section>`);
      secs.appendChild(s); fill($(".sb", s)); return s;
    }
    const topicWords = d.topic ? VOCAB.filter((v) => v[2] === d.topic) : VOCAB.filter((v) => v[3] <= 2);
    const shift = (n * 3) % Math.max(1, topicWords.length);
    const words = topicWords.slice(shift).concat(topicWords.slice(0, shift)).slice(0, 6);

    if (d.kind === "diag") {
      sec("warm", "Warm-up", "5 min", (b) => b.innerHTML = `<p>¡Hola! Erzähle dir selbst auf Spanisch in 3 Sätzen, warum du Spanisch gewählt hast.</p>`);
      sec("vocab", "Einstufungstest", "15 min", (b) => { b.innerHTML = `<p>Der Test umfasst 10 Vokabeln, 6 Grammatikfragen, einen kurzen Lese- und Hörteil und eine Schreibprobe.</p><a class="btn" href="#m-diag">Test starten</a>`; });
      ["gram", "input", "task", "speak", "review"].forEach((k) => sec(k, COMP.find((c) => c[0] === k)[1], "", (b) => b.innerHTML = `<p class="muted">Heute Teil des Einstufungstests.</p>`));
    } else if (d.kind === "mock") {
      sec("task", "Probeklausur", "Prüfungszeit", (b) => b.innerHTML = `<p>Heute schreibst du <strong>${esc(MOCKS.find((m) => m.id === d.mock).name)}</strong> unter Zeitbedingungen.</p><a class="btn" href="#mock-${d.mock}">Probeklausur öffnen</a>`);
      ["warm", "vocab", "gram", "input", "speak", "review"].forEach((k) => sec(k, COMP.find((c) => c[0] === k)[1], "", (b) => b.innerHTML = `<p class="muted">Heute entfällt dieser Baustein zugunsten der Probeklausur.</p>`));
    } else if (d.kind === "review" || d.kind === "final" || d.kind === "strategy") {
      sec("warm", "Warm-up", "5 min", (b) => b.innerHTML = `<p>${esc(PLANBITS.warmups[n % PLANBITS.warmups.length])}</p>`);
      sec("vocab", "Vokabeln wiederholen", "15 min", (b) => { b.innerHTML = `<p>Wiederhole die Karten, die du als «nochmal» markiert hast.</p><a class="btn sm" href="#m-vocab">Karteikarten</a>`; });
      sec("gram", "Grammatik wiederholen", "15 min", (b) => { const weakG = Object.entries(S.gram).sort((a, c) => a[1][0] / a[1][1] - c[1][0] / c[1][1]).slice(0, 3); b.innerHTML = weakG.length ? `<p>Deine schwächsten Themen:</p><ul>${weakG.map(([id]) => `<li><a href="#g-${id}">${esc(GRAMMAR.find((x) => x.id === id).t)}</a></li>`).join("")}</ul>` : `<p>Noch keine Fehlerdaten. Wiederhole: <a href="#g-subj1">Subjuntivo</a>, <a href="#g-indefimpf">Indefinido/Imperfecto</a>.</p>`; });
      sec("input", d.kind === "strategy" ? "Prüfungsstrategie" : "Fehlerliste", "15 min", (b) => { b.innerHTML = d.kind === "strategy" ? `<a class="btn sm" href="#m-strategy">So bearbeitest du die Klausur</a> <a class="btn sm ghost" href="#m-operatoren">Operatoren</a>` : (S.wrong.length ? `<ul class="wrongl">${S.wrong.slice(0, 10).map((w) => `<li>${esc(w.t)}</li>`).join("")}</ul>` : `<p class="muted">Noch keine Fehler gesammelt.</p>`); });
      sec("task", d.kind === "final" ? "Endspurt-Checkliste" : "Wochenaufgabe", "20 min", (b) => { b.innerHTML = d.kind === "final" ? `<a class="btn sm" href="#m-final">Endspurt öffnen</a>` : `<p>Schreibe einen Absatz (100 Wörter) zu einem Thema dieser Woche und prüfe ihn mit dem Hinweis-Check.</p><a class="btn sm" href="#m-write">Schreibtraining</a>`; });
      sec("speak", "Sprechen", "5–10 min", (b) => speakWidget(b, SPEAK[n % SPEAK.length]));
      sec("review", "Redemittel", "5 min", (b) => { const cat = REDEMITTEL[n % REDEMITTEL.length]; b.innerHTML = `<p class="lbl">${esc(cat.cat)}</p><ul class="rm">${cat.items.map((i) => `<li><strong lang="es">${esc(i[0])}</strong><span>${esc(i[1])}</span></li>`).join("")}</ul>`; });
    } else {
      const gr = GRAMMAR.find((x) => x.id === d.gram);
      sec("warm", "Warm-up", "5 min", (b) => b.innerHTML = `<p>${esc(d.warm)}</p>`);
      sec("vocab", "Vokabeln", "10–15 min", (b) => {
        b.innerHTML = `<ul class="vl">${words.map((w) => `<li><button class="say" data-say="${esc(w[0])}" aria-label="Aussprache ${esc(w[0])}">${icon("audio")}</button><span lang="es"><strong>${esc(w[0])}</strong>${w[4] ? `<em>${esc(w[4])}</em>` : ""}</span><span>${esc(w[1])}</span>${stars(w[3])}</li>`).join("")}</ul><p class="lbl">Kurztest</p>`;
        words.slice(0, 3).forEach((w, i) => { const pool = VOCAB.filter((v) => v !== w).map((v) => v[1]); const o = [w[1], pool[(n * 7 + i * 11) % pool.length], pool[(n * 13 + i * 5 + 3) % pool.length]]; const order = [0, 1, 2].sort(() => Math.random() - 0.5); MC(b, (i === 1 ? "DE → ES: " : "") + (i === 1 ? w[1] : w[0]), i === 1 ? order.map((j) => [w[0], VOCAB[(n * 7 + j * 5 + 1) % VOCAB.length][0], VOCAB[(n * 3 + j * 9 + 2) % VOCAB.length][0]][j]) : order.map((j) => o[j]), order.indexOf(0), `«${w[0]}» = ${w[1]}.`, null, { skill: "vocab" }); });
      });
      sec("gram", "Grammatik: " + gr.t, "10–15 min", (b) => grammarLesson(b, gr, true));
      sec("input", "Input: " + ({ read: "Lesen", listen: "Hören", podcast: "Podcast", clip: "Erklärclip", image: "Bild/Grafik" }[d.input]), "15–20 min", (b) => inputBlock(b, d));
      sec("task", "Abitur-Aufgabe", "20–30 min", (b) => taskBlock(b, d));
      sec("speak", "Sprechen", "5–10 min", (b) => speakWidget(b, SPEAK[d.speak]));
      sec("review", "Tageswiederholung", "5 min", (b) => { b.innerHTML = `<p class="lbl">Wörter</p><p lang="es">${words.map((w) => esc(w[0])).join(" · ")}</p><p class="lbl">Regel</p><p>${esc(gr.rule)}</p><p class="lbl">Redemittel des Tages</p>${(() => { const c = REDEMITTEL[n % REDEMITTEL.length]; const i = c.items[n % c.items.length]; return `<p lang="es"><strong>${esc(i[0])}</strong> – ${esc(i[1])}</p>`; })()}<p class="lbl">Deine Fehler heute</p>${(() => { const w = S.wrong.filter((x) => x.d === today()); return w.length ? `<ul class="wrongl">${w.map((x) => `<li>${esc(x.t)}</li>`).join("")}</ul>` : `<p class="muted">Keine – oder noch keine Übung gelöst.</p>`; })()}`; });
    }
    sec("prog", "Fortschritts-Check", "", (b) => {
      const sp = (S.time || {})[n] || 0; const todayW = S.wrong.filter((x) => x.d === today()).length;

      b.innerHTML = `<div class="stats mini"><div><span class="mono big2">${dayPct(n)}%</span><span>Tag erledigt</span></div><div><span class="mono big2">${Math.round(sp / 60)} min</span><span>Lernzeit heute</span></div><div><span class="mono big2">${todayW}</span><span>Fehler heute</span></div></div>
      ${tried[0] ? `<p>Schwächster Bereich: <strong>${SKILLS[tried[0][0]]}</strong> (${tried[0][1]} %). Empfehlung: <a href="#${modFor(tried[0][0])}">${SKILLS[tried[0][0]]} wiederholen</a>.</p>` : `<p class="muted">Löse Übungen, damit die Empfehlung erscheint.</p>`}`;

  window.leaveTag = function (n) { if (!dayStart || !n) return; S.time = S.time || {}; S.time[n] = (S.time[n] || 0) + Math.round((Date.now() - dayStart) / 1000); dayStart = 0; save(); };

  function inputBlock(b, d) {
    if (d.input === "read") { const id = READ_BY_TOPIC[d.topic] || "r1"; b.innerHTML = `<p>Text: <strong>${esc((READ[id] || LIT[id]).title)}</strong></p><a class="btn sm" href="#${READ[id] ? "read-" + id : "lit-" + id}">Text öffnen</a>`; }
    else if (d.input === "listen") { const id = HV_BY_TOPIC[d.topic] || "hv1"; b.innerHTML = `<p>Hörtext: <strong>${esc(LISTEN[id].title)}</strong> (${esc(LISTEN[id].accent)})</p><a class="btn sm" href="#hv-${id}">Hörübung öffnen</a>`; }
    else if (d.input === "podcast") { const p = PODCASTS[d.n % PODCASTS.length]; b.innerHTML = `<p class="lbl">${esc(p.series)}</p><h3>${esc(p.title)}</h3>`; Player(b, p.seg, { voice: p.voice }); }

      turismo: { t: "Bildimpuls: Ein Strand im August", q: "Describe la escena y compara la playa en agosto con la misma playa en enero.", bars: [["enero", 12], ["abril", 35], ["agosto", 96], ["octubre", 40]], unit: "Ocupación de la playa (%)" },
      migr: { t: "Grafik: Warum emigrieren junge Menschen?", q: "Presenta los datos y explica qué motivos te parecen más importantes.", bars: [["trabajo", 64], ["sueldo", 48], ["experiencia", 37], ["estudios", 22]], unit: "Encuesta a 100 jóvenes (%)" },
      pobreza: { t: "Grafik: Womit verbringen Kinder im Markt ihren Tag?", q: "Describe el gráfico y saca conclusiones.", bars: [["vender", 5], ["cargar", 2], ["escuela", 3], ["jugar", 1]], unit: "Horas al día" }
    };
    const s = sets[topic] || sets.turismo; const max = Math.max(...s.bars.map((x) => x[1]));
    b.innerHTML = `<figure class="infog"><figcaption><strong>${esc(s.t)}</strong><span class="tag warn">Beispieldaten, keine echten Statistiken</span></figcaption>
      <svg viewBox="0 0 320 170" role="img" aria-label="${esc(s.unit)}: ${s.bars.map((x) => x[0] + " " + x[1]).join(", ")}">
      ${[0, 0.5, 1].map((g) => `<line x1="40" x2="310" y1="${140 - g * 110}" y2="${140 - g * 110}" class="grid"/><text x="34" y="${144 - g * 110}" class="ax" text-anchor="end">${Math.round(max * g)}</text>`).join("")}
      ${s.bars.map((x, i) => { const hgt = (x[1] / max) * 110; const xx = 55 + i * 66; return `<rect x="${xx}" y="${140 - hgt}" width="40" height="${hgt}" rx="3" class="barr"/><text x="${xx + 20}" y="${134 - hgt}" text-anchor="middle" class="val">${x[1]}</text><text x="${xx + 20}" y="158" text-anchor="middle" class="ax">${esc(x[0])}</text>`; }).join("")}
      </svg><p class="small muted">${esc(s.unit)}</p></figure><p lang="es"><strong>Tarea:</strong> ${esc(s.q)}</p>`;
  };

  function taskBlock(b, d) {
    const k = O.kurse[S.kurs];
    if (d.task === "TA1" || d.task === "TA2") {
      const src = TEXT_BY_TOPIC[d.topic] && TEXT_BY_TOPIC[d.topic][0] !== "MED" && TEXT_BY_TOPIC[d.topic][0] !== "LISTEN" ? TEXT_BY_TOPIC[d.topic] : ["READ", d.n % 2 ? "r1" : "r2"];
      const tx = window[src[0]][src[1]];
      const op = d.task === "TA1" ? ["resumir", "Resume", "Teilaufgabe 1 · AFB I/II"] : ["analizar", "Analiza", "Teilaufgabe 2 · AFB II"];
      const prompt = d.task === "TA1" ? `${op[1]} el contenido del texto «${tx.title}».` : `${op[1]} los recursos que usa el texto «${tx.title}» y su efecto en el lector.`;
      b.innerHTML = `<p class="lbl">${op[2]} · Operator <em lang="es">${op[0]}</em></p><p class="task" lang="es">${esc(prompt)}</p><p><a href="#${src[0] === "READ" ? "read-" : "lit-"}${src[1]}">Text öffnen</a> · <a href="#op-${op[0]}">Was verlangt «${op[0]}»?</a></p>`;
    } else if (d.task === "TA3") {
      b.innerHTML = `<p class="lbl">Teilaufgabe 3 · AFB II/III · Operator <em lang="es">comentar</em></p><p class="task" lang="es">Comenta la afirmación: ${esc(TA3[d.topic] || TA3.jovenes)}</p><p class="hint">Aufbau: Position → 2 Argumente mit Beispielen aus dem Unterricht → Gegenargument («si bien es cierto que…») → Fazit. 200–250 Wörter.</p>`;
    } else if (d.task === "SM") {
      const m = MICRO[d.n % MICRO.length];
      b.innerHTML = `<p class="lbl">Sprachmittlung · Mini-Aufgabe</p><p class="task">${esc(m[1])}</p><p class="hint">Nicht übersetzen, sondern erklären: «En Alemania, … es una especie de …». Danach die große Übung: <a href="#m-mediation">Sprachmittlung</a>.</p>`;
    } else if (d.task === "HV") {
      const id = HV_BY_TOPIC[d.topic] || "hv1";
      b.innerHTML = `<p class="lbl">Hörverstehen · Prüfungsformat</p><p>Bearbeite den Hörtext wie im Abitur: Fragen lesen, zweimal hören, beantworten.</p><a class="btn sm" href="#hv-${id}">${esc(LISTEN[id].title)}</a>`;
    } else {
      b.innerHTML = `<p class="lbl">Operatoren-Training</p><p>Welcher Operator passt?</p>`;
      const ops = OPERATORS.SL; const pick = [ops[(d.n * 3) % ops.length], ops[(d.n * 5 + 4) % ops.length]];
      pick.forEach((o, i) => { const others = ops.filter((x) => x !== o); const opts = [o[0], others[(d.n + i) % others.length][0], others[(d.n + i + 5) % others.length][0]]; const ord = [0, 1, 2].sort(() => Math.random() - 0.5); MC(b, o[1], ord.map((j) => opts[j]), ord.indexOf(0), `«${o[0]}»: ${o[2]}`, null, { skill: "exam" }); });
    }
    const t = h(`<div class="row"></div>`); b.appendChild(t); Timer(t, d.phase === "Prüfungstraining" ? 30 * 60 : 20 * 60, "Bearbeitungszeit");
  }

  /* ---- Grammatiklektion: Erklären → Beispiel → Üben → Prüfung → Fehlerkorrektur ---- */
  window.grammarLesson = function (b, gr, compact) {
    b.innerHTML = `<div class="gsteps">
      <div><p class="lbl">1 · Regel</p><p>${esc(gr.rule)}</p></div>
      <div><p class="lbl">2 · Beispiele</p><ul class="exl" lang="es">${gr.ex.map((x) => `<li><button class="say" data-say="${esc(x)}" aria-label="Vorlesen">${icon("audio")}</button>${esc(x)}</li>`).join("")}</ul></div>
      <div class="drills"><p class="lbl">3 · Übung</p></div>
      <div><p class="lbl">4 · Im Abitur</p><p>${esc(gr.exam)}</p></div>
      <div class="fix"><p class="lbl">5 · Fehler finden</p><p>Was ist falsch? <span lang="es" class="err">${esc(gr.mistake[0])}</span></p><button class="btn sm ghost">Lösung zeigen</button><p class="sol" hidden lang="es">${esc(gr.mistake[1])}</p></div></div>`;
    const dr = $(".drills", b);
    gr.drill.forEach((x) => MC(dr, x[0], x[1], x[2], x[3], null, { skill: "grammar", gram: gr.id }));
    $(".fix button", b).onclick = function () { $(".fix .sol", b).hidden = false; this.remove(); };
    b.addEventListener("click", (e) => { const s = e.target.closest("[data-say]"); if (s && !e.target.closest(".secs")) say(s.dataset.say); });
  };

  /* ---- Sprechen ---- */
  window.speakWidget = function (b, sp) {
    b.innerHTML = `<p class="lbl">${esc(sp.type)} ${stars(sp.lvl)}</p><p class="task" lang="es">${esc(sp.prompt)}</p><div class="row tw"></div>
      ${canRecord() ? `<div class="recwrap"></div>` : `<p class="note">Aufnahme: Das Mikrofon ist in dieser Ansicht gesperrt. Nimm dich mit der Sprachmemo-App deines Handys auf und hör dich danach an. In der installierten Version kannst du direkt hier aufnehmen.</p>`}
      <p class="lbl">Selbstcheck nach dem Sprechen</p><ul class="checks">${sp.check.map((c, i) => `<li><label><input type="checkbox" data-i="${i}"> <span lang="es">${esc(c)}</span></label></li>`).concat(["Flüssig, ohne lange Pausen", "Aussprache klar (r/rr, b/v, Betonung)", "Grammatik überwiegend korrekt"].map((c) => `<li><label><input type="checkbox"> ${esc(c)}</label></li>`)).join("")}</ul>
      <button class="btn sm ghost sp-save">Selbstcheck speichern</button><p class="fb small"></p>`;
    if (canRecord()) Recorder($(".recwrap", b));
    const tw = $(".tw", b); const prep = Timer(tw, sp.prep, "Vorbereitung"); Timer(tw, sp.talk, "Sprechzeit");
    $(".sp-save", b).onclick = () => { const all = $$(".checks input", b); const pct = all.filter((x) => x.checked).length / all.length; recordScore("speaking", pct); $(".fb", b).textContent = `Gespeichert: ${Math.round(pct * 100)} % der Kriterien erfüllt (Selbsteinschätzung).`; };
  };
})();

<script>
/* ===== Module ===== */
(function () {
  const O = window.OFFICIAL;
  const MODS = [

  /* ---------- Schreiben ---------- */
  const CONN = ["además", "asimismo", "sin embargo", "no obstante", "en cambio", "por un lado", "por otro lado", "ya que", "puesto que", "debido a", "por lo tanto", "por consiguiente", "de ahí que", "aunque", "si bien", "en definitiva", "en resumen", "en primer lugar", "por último", "mientras que", "a diferencia de", "al igual que", "es decir", "por ejemplo", "en conclusión", "para concluir", "por eso", "así que", "dado que"];
  const ERR = [
    [/\bla (problema|tema|sistema|programa|clima|idioma|mapa|drama)\b/gi, (m) => `«${m}» → Diese Wörter auf -ma sind maskulin: «el ${m.split(" ")[1]}».`],
    [/\bla gente (son|están|tienen|piensan|dicen|van)\b/gi, (m) => `«${m}» → «la gente» ist Singular: la gente es/está/tiene…`],
    [/\bme (gusta|encanta|interesa) (los|las) /gi, (m) => `«${m}…» → bei Plural: me gustan/encantan/interesan los…`],
    [/\b(pero sin embargo|pero no obstante)\b/gi, (m) => `«${m}» → doppelter Gegensatz; nur einen Konnektor verwenden.`],
    [/\beventualmente\b/gi, () => `«eventualmente» ≠ eventuell. Für «eventuell» besser: quizás, posiblemente.`],

    [/\bdepende en\b/gi, () => `«depende en» → «depende de».`],
    [/\bpensar sobre\b/gi, () => `«pensar sobre» → meist «pensar en» (an etwas denken) oder «opinar sobre».`],
    [/\b(es|resulta) (importante|necesario|fundamental|imprescindible|esencial) que (\w+) (tiene|es|hay|hacen|tienen|son|puede|pueden|debe|deben)\b/gi, (m) => `«${m}» → nach Wertung + que steht Subjuntivo (tenga, sea, haya, hagan, tengan, sean, pueda, puedan, deba, deban).`],
    [/\bno creo que (\w+ )?(es|son|tiene|tienen|hay|puede|pueden)\b/gi, (m) => `«${m}» → nach «no creo que» steht Subjuntivo.`],
    [/\bcuando (tendré|tendrá|seré|será|podré|terminaré|vendré|iré)\b/gi, (m) => `«${m}» → nach «cuando» mit Zukunftsbezug: Subjuntivo (tenga, sea, pueda, termine…).`],

  ];

  const STOP = new Set("el la los las un una unos unas de del a al y o que en es son se no por para con su sus lo le les me te nos más muy pero como este esta estos estas ese esa hay ha han está están ser mi tu yo él ella ellos también porque cuando".split(" "));
  window.checkText = function (txt, minWords, isLetter) {
    const out = []; const low = txt.toLowerCase(); const words = low.match(/[a-záéíóúñü]+/g) || [];
    out.push([words.length >= minWords ? "good" : "warn", `Umfang: ${words.length} Wörter (Ziel: mindestens ${minWords}).`]);
    const con = CONN.filter((c) => low.includes(c));
    out.push([con.length >= 3 ? "good" : "warn", con.length ? `Konnektoren (${con.length}): ${con.join(", ")}.` : "Keine Konnektoren gefunden. Verknüpfe Gedanken mit sin embargo, además, por lo tanto …"]);
    const freq = {}; words.forEach((w) => { if (w.length > 3 && !STOP.has(w)) freq[w] = (freq[w] || 0) + 1; });
    const rep = Object.entries(freq).filter(([, n]) => n >= 4).map(([w, n]) => `${w} (${n}×)`);
    if (rep.length) out.push(["warn", `Wiederholungen: ${rep.join(", ")}. Nutze Synonyme oder Pronomen.`]);
    const sents = txt.split(/[.!?]+/).map((s) => s.trim()).filter(Boolean); const lens = sents.map((s) => s.split(/\s+/).length);
    if (lens.some((l) => l > 40)) out.push(["warn", "Mindestens ein Satz hat über 40 Wörter. Teile ihn für mehr Klarheit."]);
    if (sents.length >= 4 && lens.every((l) => l < 9)) out.push(["warn", "Nur sehr kurze Sätze. Variiere den Satzbau mit Relativsätzen (que, lo que, cuyo) und Nebensätzen."]);
    const subj = (low.match(/\b(que|para que|ojalá|cuando|aunque) \w*(e|a|en|an|era|iera|ieran|eras)\b/g) || []).length;
    if (minWords >= 120 && !/\b(es (importante|necesario|fundamental|lógico)|para que|no creo que|ojalá|espero que|quiero que|pido que|me preocupa que)\b/.test(low)) out.push(["warn", "Kein typischer Subjuntivo-Auslöser gefunden. Werturteile wie «es necesario que…» zeigen Abiturniveau."]);
    ERR.forEach(([re, f]) => { const m = txt.match(re); if (m) m.slice(0, 2).forEach((x) => out.push(["bad", f(x)])); });
    const acc = words.filter((w) => ACC[w]); if (acc.length) out.push(["bad", `Akzent fehlt: ${[...new Set(acc)].map((w) => w + " → " + ACC[w]).join(", ")}.`]);
    const cion = [...new Set(words.filter((w) => /[^s]cion$|sion$/.test(w) && !/ción$|sión$/.test(w)))]; if (cion.length) out.push(["bad", `Endung -ción/-sión braucht Akzent: ${cion.slice(0, 4).join(", ")}.`]);
    const qw = txt.match(/¿\s*(que|como|donde|cuando|quien|quienes|cual|cuales|cuanto|cuantos|por que)\b/gi); if (qw) out.push(["bad", `Fragewörter tragen Akzent: ${qw.slice(0, 3).join(", ")} → qué, cómo, dónde, cuándo, quién, cuál, cuánto, por qué.`]);
    if (/\?/.test(txt) && !/¿/.test(txt)) out.push(["bad", "Fragezeichen: Spanisch verlangt ¿ am Anfang der Frage."]);
    if (/!/.test(txt) && !/¡/.test(txt)) out.push(["bad", "Ausrufezeichen: Spanisch verlangt ¡ am Anfang."]);
    if (isLetter) { const tu = /\b(tú|te|tu|tienes|puedes|sabes)\b/.test(low), ud = /\b(usted|le ruego|atentamente)\b/.test(low); if (tu && ud) out.push(["warn", "Register gemischt: du-Formen und usted/Formeln zugleich. Einheitlich bleiben."]); if (!/^(\s*)(querid|hola|estimad|señor|señora|muy señor)/i.test(txt)) out.push(["warn", "Brief/E-Mail: Anrede fehlt (Hola…, Querida…, Señor director:)."]); }
    return out;
  };

      <section class="sec"><h2>Schritt 4 · Selbstbewertung (50 Punkte)</h2><div class="rs"></div><button class="btn sm" id="sm-save">Ergebnis speichern</button><span class="small muted smfb"></span></section>`;
    Timer($(".smt", root), 60 * 60, "Max. 60 Minuten");
    const ta = $("textarea", root); const up = () => { $(".wc", root).textContent = (ta.value.match(/\S+/g) || []).length + " Wörter"; S.drafts["sm" + id] = ta.value; save(); }; ta.oninput = up; up();
    $("#sm-rel", root).onclick = () => { let ok = 0, n = 0; $$(".rel input", root).forEach((c) => { n++; const r = c.dataset.r === "1"; if (c.checked === r) ok++; c.parentElement.classList.add(r ? "isrel" : "notrel"); }); $(".fb", $("#sm-rel", root).parentElement).innerHTML = `<p class="${ok === n ? "good" : "bad"}">${ok} von ${n} richtig eingeschätzt. Grün markiert = relevant, durchgestrichen = weglassen.</p>`; record("mediation", ok / n >= 0.8); };
    $("#sm-check", root).onclick = () => { const r = checkText(ta.value, id === "sm1" ? 120 : 200, true); $(".wfb", root).innerHTML = `<p class="lbl">Automatischer Hinweis-Check · keine NRW-Bewertung</p><ul class="fbl">${r.map(([k, t]) => `<li class="${k}">${esc(t)}</li>`).join("")}</ul>`; };
    $("#sm-model", root).onclick = function () { $(".model", root).hidden = false; this.remove(); };
    const rs = raster($(".rs", root), "SM");
    $("#sm-save", root).onclick = () => { const t = rs.total(); recordScore("mediation", t / 50); $(".smfb", root).textContent = ` ${t}/50 gespeichert (Selbsteinschätzung).`; };
  };

  /* ---------- Sprechen ---------- */
  window.viewSpeak = function (root) {

    SPEAK.forEach((s) => { const sec = h(`<section class="sec"></section>`); $(".sps", root).appendChild(sec); speakWidget(sec, s); });

  window.viewCulture = function (root) {

      <div class="cgrid">${CULTURE.map((c) => `<article class="card ${my.includes(c.topic) ? "" : "dim"}"><p class="lbl">${esc(TOPICS[c.topic].es)}${my.includes(c.topic) ? "" : " · nicht Fokus " + esc(O.kurse[S.kurs].short)}</p><h3>${esc(c.h)}</h3><p>${esc(c.t)}</p></article>`).join("")}</div>`;
  };

  /* ---------- Strategie ---------- */
  window.viewStrategy = function (root) {

      <section class="sec"><h2>Zeitplan für deinen Kurs (${esc(k.short)}, ${k.dauer} Min.)</h2><div class="timeline">${k.teile.map((t) => `<div class="tl-${t.key}" style="flex:${t.min}"><strong>${esc(t.key === "SL" ? "Schreiben/Lesen" : t.key === "SM" ? "Sprachmittlung" : "Hören")}</strong><span class="mono">${t.min} min</span></div>`).join("")}</div>
      <p class="hint">Vorschlag für Schreiben/Lesen (${k.teile.find((t) => t.key === "SL").min} Min.): Auswahl 10 · TA 1: ${Math.round((k.teile.find((t) => t.key === "SL").min - 30) * 0.25)} · TA 2: ${Math.round((k.teile.find((t) => t.key === "SL").min - 30) * 0.38)} · TA 3: ${Math.round((k.teile.find((t) => t.key === "SL").min - 30) * 0.37)} · Korrektur 20 Minuten. (Empfehlung des Kurses)</p></section>
      <ol class="strat">${STRATEGY.map((s) => `<li><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></li>`).join("")}</ol>
      <section class="sec"><h2>Timed: Aufgabe in 90 Sekunden zerlegen</h2><p class="task" lang="es">Comenta –a partir del texto y de lo que has aprendido en clase– la afirmación de la autora de que «sin ayuda del Estado, los proyectos locales solo son un parche».</p><div class="row tt"></div>
      <p class="lbl">Tippe an, was die Aufgabe verlangt:</p><ul class="checks dec">${[["Operator comentar: eigene begründete Meinung", 1], ["Bezug auf den Text", 1], ["Bezug auf Unterrichtswissen", 1], ["Zusammenfassung des ganzen Textes", 0], ["Stilmittelanalyse", 0], ["Schlussfolgerung / Fazit", 1]].map((x) => `<li><label><input type="checkbox" data-r="${x[1]}"> ${esc(x[0])}</label></li>`).join("")}</ul><button class="btn sm ghost" id="dec-ok">Prüfen</button><div class="fb"></div></section>`;
    Timer($(".tt", root), 90, "Zerlegen");
    $("#dec-ok", root).onclick = () => { let ok = 0; const c = $$(".dec input", root); c.forEach((x) => { if (x.checked === (x.dataset.r === "1")) ok++; x.parentElement.classList.add(x.dataset.r === "1" ? "isrel" : "notrel"); }); $(".fb", $("#dec-ok", root).parentElement).innerHTML = `<p class="${ok === c.length ? "good" : "bad"}">${ok}/${c.length}. comentar verlangt keine Zusammenfassung und keine Stilanalyse – das sind Teilaufgabe 1 und 2.</p>`; record("exam", ok === c.length); };
  };

  /* ---------- Endspurt ---------- */
  window.viewFinal = function (root) {
    root.innerHTML = `${back()}<h1>Endspurt</h1>
      <section class="sec"><h2>Deine Fehlerliste</h2>${S.wrong.length ? `<ul class="wrongl">${S.wrong.map((w) => `<li><span class="mono small">${w.d}</span> ${esc(w.t)}</li>`).join("")}</ul><button class="btn sm ghost" id="clr">Liste leeren</button>` : `<p class="muted">Keine Fehler gespeichert.</p>`}</section>
      <section class="sec"><h2>Checkliste für die letzte Woche</h2><ul class="checks">${["Hilfsmittel klären: ein- und zweisprachiges Wörterbuch mitnehmen", "Zeitplan für deinen Kurstyp auswendig können (Strategie)", "Alle Operatoren im Blitz einmal fehlerfrei", "Redemittel je Teilaufgabe: 5 sicher abrufbar", "Zieltextformate: Leserbrief, Brief/E-Mail, Artikel, Blog, Tagebucheintrag – Merkmale wiederholen", "Probeklausur 4 unter Zeitbedingungen geschrieben", "Schwerpunkte 2027 deines Kurses mit je 2 Beispielen", "Subjuntivo, Zeitenfolge, Si-Sätze: je eine Übungsseite"].map((c, i) => `<li><label><input type="checkbox" data-i="${i}" ${(S.final || {})[i] ? "checked" : ""}> ${esc(c)}</label></li>`).join("")}</ul></section>
      <section class="sec"><h2>Alle Grammatikregeln kompakt</h2><dl class="rules">${GRAMMAR.map((g) => `<dt>${esc(g.t)}</dt><dd>${esc(g.rule)}</dd>`).join("")}</dl></section>`;
    const c = $("#clr", root); if (c) c.onclick = () => { S.wrong = []; save(); rerender(); };
    $$(".checks input", root).forEach((x) => x.onchange = () => { S.final = S.final || {}; S.final[x.dataset.i] = x.checked; save(); });
  };
})();

<script>
/* ===== Prüfung, Grundlagen/Bericht, Router ===== */
(function () {
  const O = window.OFFICIAL;
  const npFrom = (pts, max) => { const tbl = max === 160 ? O.noten160 : O.noten200; return (tbl.find((r) => pts >= r[0]) || [0, 0])[1]; };

  window.viewPruefung = function (root) {
    const k = O.kurse[S.kurs];
    root.innerHTML = `<div class="ph"><h1>Prüfung</h1><span class="tag off">Offiziell NRW · Abitur 2027</span></div>
      <section class="panel"><p class="eyebrow">${esc(k.name)} · ${esc(O.examDateLabel)}</p>
        <div class="timeline">${k.teile.map((t) => `<div class="tl-${t.key}" style="flex:${t.min}"><strong>${t.key === "HV" ? "Hörverstehen" : t.key === "SM" ? "Sprachmittlung" : "Schreiben / Leseverstehen"}</strong><span class="mono">${t.min} min · ${t.pts} P.</span></div>`).join("")}</div>
        <ul class="small">${k.teile.map((t) => `<li>${esc(t.name)}: ${esc(t.note)}</li>`).join("")}<li>Reihenfolge fest; jeder Teil wird nach Bearbeitung eingesammelt.</li><li>Hilfsmittel: ${O.hilfsmittel.map(esc).join("; ")}.</li></ul>
      </section>
      <div class="ph"><h2>Probeklausuren</h2><span class="tag">Übungsmaterial</span></div>
      <div class="modgrid">${MOCKS.map((m) => { const r = S.mocks[m.id]; return `<a class="mod" href="#mock-${m.id}">${icon("exam")}<strong>${esc(m.name)}</strong><span>${stars(m.lvl)} ${r ? `· zuletzt ${r.np} NP (${r.total}/${r.max})` : "· noch nicht geschrieben"}</span></a>`; }).join("")}</div>
      <p class="note">Probeklausuren 1–3 nutzen Texte, die du aus den Modulen kennen kannst. Probeklausur 4 folgt dem vollständigen Ablauf deines Kurstyps. Alle Aufgaben sind eigene Übungsaufgaben im Stil der NRW-Vorgaben, keine Originalprüfungen.</p>`;
  };

  window.viewMock = function (root, id) {
    const m = MOCKS.find((x) => x.id === id) || MOCKS[0]; const k = O.kurse[S.kurs];
    const hasHV = k.hv; const max = hasHV ? 200 : 160;
    const R = { hv: null, sm: null, sl: null };
    root.innerHTML = `<a class="back" href="#pruefung">${icon("back")} Prüfung</a><p class="eyebrow">${esc(k.name)} · ${stars(m.lvl)}</p><h1>${esc(m.name)}</h1>
      ${m.guided ? `<p class="callout">Geführte Klausur: Du bekommst zu jeder Teilaufgabe Hinweise. Zeiten sind Richtwerte.</p>` : `<p class="muted">Arbeite in der vorgegebenen Reihenfolge. Die Zeitangaben entsprechen deinem Kurstyp.</p>`}
      <div class="parts"></div>
      <section class="sec final"><h2>Auswertung</h2><div class="sum"></div><button class="btn" id="mk-save">Klausur auswerten und speichern</button></section>`;
    const parts = $(".parts", root);

    /* Teil HV */
    if (hasHV) {
      const sec = h(`<section class="sec"><h2>Teil 1 · Hörverstehen <span class="mono small">30 min · 40 P.</span></h2><p class="hint">Jeder Text: Lesezeit für die Fragen, dann zweimal hören. Antworten erst am Ende abgeben.</p><div class="hvs"></div><button class="btn sm" id="hv-sub">Hörverstehen abgeben</button><div class="hvres"></div></section>`);
      parts.appendChild(sec);
      const items = [];
      m.hv.forEach((hid, ti) => {
        const l = LISTEN[hid]; const box = h(`<div class="hvbox"><h3>Hörtext ${ti + 1}: <span lang="es">${esc(l.title)}</span> <small class="muted">(${esc(l.accent)})</small></h3><div class="row auto"><button class="btn sm ghost">Prüfungsablauf starten</button><span class="small muted st"></span></div><div class="pl"></div><div class="qq"></div></div>`);
        $(".hvs", sec).appendChild(box);
        const pl = Player($(".pl", box), [["es", l.text]], { voice: l.voice, transcript: false });
        l.q.forEach((q, qi) => {
          const nm = `${id}-${hid}-${qi}`;
          const qel = q.type === "mc" ? h(`<fieldset class="ex"><legend class="ex-q">[${q.op}] ${esc(q.q)}</legend>${q.o.map((o, oi) => `<label class="radio"><input type="radio" name="${nm}" value="${oi}"> <span lang="es">${esc(o)}</span></label>`).join("")}<div class="fb"></div></fieldset>`)
            : h(`<div class="ex"><label class="ex-q" for="${nm}">[${q.op}] ${esc(q.q)}</label><input id="${nm}" class="inp" autocomplete="off"><div class="fb"></div></div>`);
          $(".qq", box).appendChild(qel); items.push({ q, qel, nm });
        });
        const st = $(".st", box);
        $(".auto button", box).onclick = function () {
          this.disabled = true; let t = m.guided ? 20 : 45;
          const tick = () => { st.textContent = `Lesezeit: ${t} s`; if (t-- > 0) setTimeout(tick, 1000); else first(); };
          const first = () => { st.textContent = "Erstes Hören …"; pl.restart(); pl.el.dataset.round = 1; };
          pl.el.addEventListener("ended", () => {});
          const obs = setInterval(() => {
            if (!speechSynthesis.speaking && pl.el.dataset.round === "1" && st.textContent.startsWith("Erstes")) { st.textContent = "Pause (15 s) …"; setTimeout(() => { st.textContent = "Zweites Hören …"; pl.el.dataset.round = 2; pl.restart(); }, 15000); }
            if (!speechSynthesis.speaking && pl.el.dataset.round === "2" && st.textContent.startsWith("Zweites")) { st.textContent = "Fertig. Antworten prüfen, dann weiter."; clearInterval(obs); }
          }, 1500);
          tick();
        };
      });
      $("#hv-sub", sec).onclick = function () {
        let be = 0;
        items.forEach(({ q, qel, nm }) => {
          let ok;
          if (q.type === "mc") { const c = $(`input[name="${nm}"]:checked`, qel); ok = c && +c.value === q.a; $$("input", qel).forEach((x) => (x.disabled = true)); }
          else { const v = norm($("input", qel).value); ok = !!v && q.keys.some((kk) => v.includes(norm(kk))); $("input", qel).disabled = true; }
          if (ok) be++; record("listening", !!ok, null, ok ? null : "HV: " + q.q);
          $(".fb", qel).innerHTML = `<p class="${ok ? "good" : "bad"}">${ok ? "Richtig" : "Falsch"} – Lösung: <span lang="es">${esc(q.type === "mc" ? q.o[q.a] : q.a)}</span></p>`;
        });
        const pts = Math.round((be / items.length) * 40); R.hv = pts;
        $(".hvres", sec).innerHTML = `<p class="good"><strong>${be} von ${items.length} Bewertungseinheiten → ${pts} von 40 Punkten</strong> (Umrechnung wie in den Konstruktionshinweisen).</p>`;
        this.remove(); sum();
      };
    }

    /* Teil SM */
    const sm = MEDIATION[m.sm];
    const s2 = h(`<section class="sec"><h2>Teil ${hasHV ? 2 : 1} · Sprachmittlung <span class="mono small">max. 60 min · 50 P.</span></h2>
      <p class="lbl">Situación</p><p lang="es">${esc(sm.situation)}</p><p class="task" lang="es">${esc(sm.task)}</p>
      <details ${m.guided ? "open" : ""}><summary>Ausgangstext (Deutsch)</summary><article class="text src" lang="de">${sm.source.map((p, i) => i ? `<p>${esc(p)}</p>` : `<h3>${esc(p)}</h3>`).join("")}</article></details>
      ${m.guided ? `<p class="hint">Hinweis: Filtere nach dem, was ${esc(sm.situation.split(",")[0].replace("Tu ", "dein/e "))} wissen will. Kulturbegriffe erklären.</p>` : ""}
      <div class="row smt"></div><textarea rows="12" lang="es" aria-label="Sprachmittlung" id="mk-sm-${id}">${esc(S.drafts["mk-sm-" + id] || "")}</textarea>
      <details><summary>Nach dem Schreiben: Erwartungshorizont</summary><ul>${sm.relevant.map((r) => `<li lang="es">${esc(r)}</li>`).join("")}</ul><pre class="letter" lang="es">${esc(sm.model)}</pre></details>
      <p class="lbl">Selbstbewertung</p><div class="rs"></div></section>`);
    parts.appendChild(s2); Timer($(".smt", s2), 60 * 60, "Sprachmittlung");
    const smta = $("textarea", s2); smta.oninput = () => { S.drafts["mk-sm-" + id] = smta.value; save(); };
    const smR = raster($(".rs", s2), "SM", (t) => { R.sm = t; sum(); });

    /* Teil SL */
    const slMin = k.teile.find((t) => t.key === "SL").min;
    const s3 = h(`<section class="sec"><h2>Teil ${hasHV ? 3 : 2} · Schreiben / Leseverstehen <span class="mono small">${slMin} min · 110 P.</span></h2>
      ${m.sl.length > 1 ? `<div class="seg" role="radiogroup" aria-label="Aufgabenwahl">${m.sl.map((a, i) => `<button role="radio" aria-checked="${i === 0}" data-a="${i}"><strong>${esc(a.label)}</strong><small lang="es">${esc(window[a.src][a.text].title)}</small></button>`).join("")}</div>` : ""}
      <div class="row slt"></div><div class="slbody"></div><p class="lbl">Selbstbewertung (Kriterienraster NRW)</p><div class="rs"></div></section>`);
    parts.appendChild(s3); Timer($(".slt", s3), slMin * 60, "Schreiben/Lesen");
    function showA(ai) {
      const a = m.sl[ai]; const tx = window[a.src][a.text];
      $(".slbody", s3).innerHTML = `<div class="split"><div><p class="eyebrow">${esc(a.label)} · ${esc(tx.kind)}</p><h3 lang="es">${esc(tx.title)}</h3>${textHTML(tx)}</div><div class="tasks">${a.tasks.map((t) => `<div class="tk ${t[0].length > 1 ? "alt" : ""}"><p class="task" lang="es"><strong>${t[0]}.</strong> ${esc(t[1])}</p>${m.guided && t[2] ? `<p class="hint">${esc(t[2])}</p>` : ""}</div>`).join("")}
        <div class="seg sm" role="radiogroup" aria-label="Teilaufgabe 3"><button role="radio" aria-checked="true" data-t="3a">3a wählen</button><button role="radio" aria-checked="false" data-t="3b">3b wählen</button></div>
        ${["1", "2", "3"].map((n) => `<label class="lbl" for="mk-${id}-${ai}-${n}">Antwort ${n}</label><textarea id="mk-${id}-${ai}-${n}" rows="${n === "1" ? 6 : 10}" lang="es">${esc(S.drafts[`mk-${id}-${ai}-${n}`] || "")}</textarea>`).join("")}</div></div>`;
      $$("textarea", s3).forEach((t) => t.oninput = () => { S.drafts[t.id] = t.value; save(); });
      $$("[data-t]", s3).forEach((b) => b.onclick = () => $$("[data-t]", s3).forEach((x) => x.setAttribute("aria-checked", x === b)));
    }
    $$("[data-a]", s3).forEach((b) => b.onclick = () => { $$("[data-a]", s3).forEach((x) => x.setAttribute("aria-checked", x === b)); showA(+b.dataset.a); });
    showA(0);
    const slR = raster($(".rs", s3), "SL", (t) => { R.sl = t; sum(); });

    function sum() {
      const tot = (R.hv || 0) + (R.sm || 0) + (R.sl || 0);
      $(".sum", root).innerHTML = `<table class="tbl"><tbody>${hasHV ? `<tr><td>Hörverstehen</td><td class="mono">${R.hv == null ? "–" : R.hv} / 40</td></tr>` : ""}<tr><td>Sprachmittlung</td><td class="mono">${R.sm || 0} / 50</td></tr><tr><td>Schreiben / Leseverstehen</td><td class="mono">${R.sl || 0} / 110</td></tr><tr><th>Gesamt</th><th class="mono">${tot} / ${max} → ${npFrom(tot, max)} Notenpunkte</th></tr></tbody></table>
        <p class="note small">Notenpunkte nach der Umrechnungstabelle der Konstruktionshinweise (${max} Punkte). Sprachmittlung und Schreiben sind Selbstbewertung.</p>`;
      return tot;
    }
    sum();
    $("#mk-save", root).onclick = () => {
      const tot = sum(); const np = npFrom(tot, max);
      S.mocks[id] = { date: today(), total: tot, max, np }; recordScore("exam", tot / max); checkBadges(); save();
      $("#mk-save", root).textContent = "Gespeichert: " + np + " Notenpunkte";
    };
  };

  /* ---------- Grundlagen & Bericht ---------- */
  window.RESP = [
    ["1920 × 1080", "Desktop", "Seitenleiste links (210 px), Inhalt max. 1060 px", "44 Ansichten ohne Fehler, kein horizontales Scrollen"],
    ["1440 × 900", "Laptop", "Seitenleiste links, Text + Aufgaben nebeneinander", "44 Ansichten ohne Fehler, kein horizontales Scrollen"],
    ["1024 × 1366", "Tablet hoch (iPad Pro)", "Seitenleiste links", "44 Ansichten ohne Fehler, kein horizontales Scrollen"],
    ["768 × 1024", "Tablet hoch (iPad)", "Tab-Leiste unten (57 px)", "44 Ansichten ohne Fehler, kein horizontales Scrollen"],
    ["390 × 844", "Smartphone (iPhone 14)", "Tab-Leiste unten, einspaltig", "44 Ansichten ohne Fehler, kein horizontales Scrollen"],
    ["375 × 812", "Smartphone (iPhone X)", "Tab-Leiste unten, einspaltig", "44 Ansichten ohne Fehler, kein horizontales Scrollen"]
  ];
  window.viewGrundlagen = function (root) {
    const K = O.kurse;
    const plans = [30, 60, 90, 120].map((l) => { const d = genPlan(l, S.kurs); const c = (k) => d.filter((x) => x.kind === k).length; return { l, day: c("day"), review: c("review"), mock: c("mock"), other: c("diag") + c("strategy") + c("final") }; });
    const reqs = [
      ["Klausurstruktur HV → SM → S/L integriert (Aufgabenart 1.1)", "GK f, LK", "Hören, Sprachmittlung, Schreiben/Lesen", "3 Klausurteile, feste Reihenfolge", 0],
      ["Klausurstruktur SM → S/L integriert, kein Hörverstehen", "GK n", "Sprachmittlung, Schreiben/Lesen", "2 Klausurteile", 0],
      ["Dauer 315 / 285 / 255 Minuten, SM max. 60 Min., HV 30 Min.", "LK / GK f / GK n", "Alle", "Zeitvorgabe", 0],
      ["Hörverstehen: i. d. R. 3 Texte, ca. 10 Min., zweimal gehört, keine Aufgabenwahl", "GK f, LK", "Hörverstehen", "Mehrfachwahl, Zuordnung, Kurzantwort, Ergänzung", 2],
      ["Sprachmittlung: deutscher Sach-/Gebrauchstext, keine Aufgabenwahl", "alle", "Sprachmittlung", "E-Mail/Brief u. a. an zielsprachige Adressaten", 0],
      ["S/L: Wahl zwischen Aufgabe I (literarisch) und II (Sach-/Gebrauchstext); in Teilaufgabe 3 Wahl zwischen zwei Alternativen", "alle", "Schreiben, Leseverstehen, Text- und Medienkompetenz", "TA 1 Zusammenfassung, TA 2 Analyse, TA 3 Kommentar oder produktiv", 0],
      ["Zieltextformate: Leserbrief, Brief/E-Mail, Artikel, Blog, Tagebucheintrag", "alle", "Schreiben (produktiv)", "TA 3 produktionsorientiert", 0],
      ["Textlänge S/L max. 550 / 800 / 1.000 Wörter; SM 400–500 bzw. 450–650 Wörter", "GK n / GK f / LK", "Lesen, Sprachmittlung", "Textvorlage", 2],
      ["Bewertung S/L 110 P. (44 Inhalt / 66 Sprache), SM 50 P. (20/30), HV 40 P.", "alle", "Alle", "Kriteriengeleitete Bewertung", 2],
      ["Operatoren gültig ab Abitur 2025 (S/L, SM, HV)", "alle", "Alle", "Aufgabenstellung", 1],
      ["Hilfsmittel: ein- und zweisprachiges Wörterbuch u. a.", "alle", "Alle", "–", 0],
      ["Fokussierungen des soziokulturellen Orientierungswissens (s. unten)", "je Kurstyp", "Interkulturelle Kompetenz", "v. a. Schreiben/Lesen", 0],
      ["Termin schriftliche Prüfung Spanisch: Do, 15.04.2027; mündliche Prüfungen 4. Fach ab 10.05.2027", "GK, LK", "–", "–", 3],
      ["Referenzniveau: fortgeführt B2 (mündlich) bzw. B2/C1; neu einsetzend B1 mit Anteilen B2", "alle", "Alle Kompetenzen", "–", 5]
    ];
    const allTopics = ["migr", "biling", "turismo", "pobreza", "etnica", "dict", "fant", "chile"];
    const status = [
      ["NRW-Anforderungen", "Verified", "Aus den amtlichen Dokumenten (Vorgaben 2027, Operatoren, Konstruktionshinweise, Termine) recherchiert."],
      ["30-Tage-Kurs", "Complete", "Generator erzeugt 30 Tage inkl. Diagnose, 4 Probeklausuren, Strategie, Endspurt."],
      ["60-Tage-Kurs", "Complete", "Wie oben, 60 Tage."],
      ["90-Tage-Kurs", "Complete", "Wie oben, 90 Tage."],
      ["120-Tage-Kurs", "Complete", "Wie oben; Inhalte (Texte, Hörtexte) wiederholen sich über lange Pläne – Issue: begrenzter Textpool."],
      ["Audio", "Issues", "Über Sprachausgabe des Geräts, kein Originalton; Stimmen/Akzente hängen vom Gerät ab."],
      ["Podcast", "Issues", window.STANDALONE ? "Player mit Tempo, ±10 s, Fortschritt, Transkript, Vokabeln; Transkripte als Datei speicherbar, Audio selbst nicht (Sprachausgabe des Geräts)." : "Player mit Tempo, ±10 s, Fortschritt, Transkript, Vokabeln; Download nicht möglich (Transkript kopierbar)."],
      ["Video", "Issues", "Als animierte Erklärclips mit Sprachausgabe und Untertiteln ES|DE; kein gefilmtes Video."],
      ["Interaktive Übungen", "Verified", "MC, Zuordnen, Satzbau, Lücke/Kurzantwort, Karteikarten, Markieren, Timer – im Browser getestet."],
      ["Probeklausuren", "Issues", "4 Klausuren mit Auto-Auswertung HV und Selbstbewertung; Texte teils aus den Modulen bekannt."],
      ["Tablet", "Verified", "Siehe Tabelle F."],
      ["Mobil", "Verified", "Siehe Tabelle F."],
      ["Barrierefreiheit", "Issues", "Große Schrift, Kontrast, Transkripte, Tastatur und ARIA umgesetzt; kein Screenreader-Test mit echter Hilfstechnik."],
      ["Fortschritt", "Verified", "Lokal im Browser gespeichert; nicht geräteübergreifend."]
    ];
    root.innerHTML = `<div class="ph"><h1>Grundlagen & Bericht</h1></div>
      <p>Diese Seite trennt klar: <span class="tag off">Offiziell NRW</span> = aus amtlichen Dokumenten für das <strong>Abitur 2027</strong>; <span class="tag">Übungsmaterial</span> = für diesen Kurs erstellt. Für die Abiturjahrgänge 2028 und 2029 gibt es eigene Vorgaben, die hier nicht verwendet werden.</p>

      <section class="sec"><h2>A · NRW-Anforderungen (Abitur 2027)</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Anforderung</th><th>Kurs</th><th>Kompetenz</th><th>Aufgabenformat</th><th>Quelle</th></tr></thead><tbody>
        ${reqs.map((r) => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td><a href="${O.sources[r[4]].url}" target="_blank" rel="noopener">${esc(O.sources[r[4]].name.split(" (")[0])}</a></td></tr>`).join("")}
      </tbody></table></div>
      <h3>Klausurteile je Kurstyp</h3><div class="kgrid">${Object.entries(K).map(([key, k]) => `<article class="card"><h4>${esc(k.name)}</h4><p class="mono">${k.dauer} min · GER ${esc(k.ger)}</p><ul class="small">${k.teile.map((t) => `<li>${esc(t.name)} – ${t.pts} P.</li>`).join("")}</ul></article>`).join("")}</div>
      <h3>Fokussierungen 2027</h3><div class="tblwrap"><table class="tbl center"><thead><tr><th>Schwerpunkt</th><th>GK n</th><th>GK f</th><th>LK</th></tr></thead><tbody>
        ${allTopics.map((t) => `<tr><td lang="es">${esc(TOPICS[t].es)}<br><small class="muted">${esc(TOPICS[t].de)}</small></td>${["GKn", "GKf", "LK"].map((kk) => { const f = O.fokus[kk].find((x) => x.topic === t); return `<td title="${f ? esc(f.t) : ""}">${f ? "●" : "–"}</td>`; }).join("")}</tr>`).join("")}
      </tbody></table></div><p class="small muted">Genaue Titel (Auszug für deinen Kurs, ${esc(K[S.kurs].short)}):</p><ul class="small" lang="es">${O.fokus[S.kurs].map((f) => `<li>${esc(f.t)}</li>`).join("")}</ul>
      <p class="small">Themenfelder des Kernlehrplans bleiben insgesamt verbindlich; Hörverstehen und Sprachmittlung können auch einen allgemeineren lebensweltlichen Bezug haben. Eine konkrete Pflichtlektüre wird für 2027 nicht vorgegeben; der GK n arbeitet mit Texten von Antonio Skármeta.</p>
      <h3>Bewertung Schreiben/Leseverstehen: Darstellungsleistung (66 P.)</h3><div class="tblwrap"><table class="tbl"><tbody>${O.bewertungSL.kriterien.map(([g, it]) => it.map((x, i) => `<tr>${i === 0 ? `<th rowspan="${it.length}">${esc(g)}</th>` : ""}<td>${esc(x[0])}</td><td class="mono">${x[1]}</td></tr>`).join("")).join("")}</tbody></table></div>
      <h3>Mündliche Prüfung</h3><p>Mündliche Prüfungen im 4. Abiturfach ab 10.05.2027. Laut Handreichung orientieren sich mündliche Prüfungen am Ende der Q-Phase in fortgeführten Fremdsprachen (außer Englisch) an B2, in neu einsetzenden an B1 mit Anteilen von B2. Format und Themen legt die Schule fest.</p>
      <h3>Quellen</h3><ol class="small">${O.sources.map((s) => `<li><a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)}</a></li>`).join("")}</ol></section>

      <section class="sec"><h2>B · Kursstruktur (${esc(K[S.kurs].short)})</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Plan</th><th>Lerntage</th><th>Wiederholung</th><th>Probeklausuren</th><th>Diagnose/Strategie/Endspurt</th></tr></thead><tbody>${plans.map((p) => `<tr><td class="mono">${p.l} Tage</td><td class="mono">${p.day}</td><td class="mono">${p.review}</td><td class="mono">${p.mock}</td><td class="mono">${p.other}</td></tr>`).join("")}</tbody></table></div><p class="small">Phasen: Grundlagen (1. Drittel), Vertiefung (2. Drittel), Prüfungstraining (letztes Drittel). Themen rotieren durch die Fokussierungen deines Kurstyps.</p></section>

      <section class="sec"><h2>C · Tagespaket</h2><ol class="small">${[["Warm-up", "5 min"], ["Vokabeln ES↔DE mit Beispielsatz und Kurztest", "10–15 min"], ["Grammatik: Regel, Beispiele, Übung, Abitur-Anwendung, Fehlerkorrektur", "10–15 min"], ["Input: Lesen, Hören, Podcast, Erklärclip oder Grafik (rotierend)", "15–20 min"], ["Abitur-Aufgabe (TA 1, TA 2, TA 3, Sprachmittlung, Hörverstehen oder Operatoren)", "20–30 min"], ["Sprechen mit Vorbereitungs- und Sprechzeit", "5–10 min"], ["Tageswiederholung inkl. eigener Fehler", "5 min"], ["Fortschritts-Check", "–"]].map((x) => `<li>${esc(x[0])} <span class="mono muted">${x[1]}</span></li>`).join("")}</ol></section>

      <section class="sec"><h2>D · Multimedia</h2><ul class="small">
        <li><strong>Audio:</strong> ${Object.keys(LISTEN).length} Hörtexte (Spanien, Mexiko, Argentinien) über Sprachausgabe.</li>
        <li><strong>Podcasts:</strong> ${PODCASTS.length} Folgen in 5 Reihen, Player mit 0,75–1,5×, ±10 s, Transkript, Vokabeln, Fragen.</li>
        <li><strong>Video:</strong> ${CLIPS.length} Erklärclips als animierte Folien mit Untertiteln ES | DE.</li>
        <li><strong>Interaktiv:</strong> Mehrfachwahl, Zuordnen, Satzbau, Kurzantwort, Karteikarten, Markieren, Beleg antippen, Timer.</li>
        <li><strong>Lesen:</strong> ${Object.keys(READ).length + Object.keys(LIT).length} Texte · <strong>Schreiben:</strong> 6 Stufen · <strong>Sprechen:</strong> ${SPEAK.length} Formate · <strong>Quiz:</strong> in jedem Modul.</li></ul></section>

      <section class="sec"><h2>E · Prüfungsvorbereitung</h2><p class="small">Abgedeckt: Wortschatz (${VOCAB.length}), Grammatik (${GRAMMAR.length} Themen), Lesen, Hören, Schreiben, Sprachmittlung (2 + Mini), Sprechen, Textanalyse mit Markierwerkzeug, Operatoren (${OPERATORS.SL.length + OPERATORS.SM.length + OPERATORS.HV.length}), Prüfungsstrategie, ${MOCKS.length} Probeklausuren.</p></section>

      <section class="sec"><h2>F · Responsives Design (getestet)</h2>${RESP.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Größe</th><th>Gerät</th><th>Navigation</th><th>Ergebnis</th></tr></thead><tbody>${RESP.map((r) => `<tr><td class="mono">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted">Noch nicht getestet.</p>`}</section>

      <section class="sec"><h2>G · Status</h2><div class="tblwrap"><table class="tbl"><thead><tr><th>Bereich</th><th>Status</th><th>Hinweis</th></tr></thead><tbody>${status.map((s) => `<tr><td>${esc(s[0])}</td><td><span class="st st-${s[1].toLowerCase()}">${s[1]}</span></td><td class="small">${esc(s[2])}</td></tr>`).join("")}</tbody></table></div></section>`;
  };

  /* ---------- Router ---------- */
  let curDay = 0;
  function route() {
    stopAudio(); if (curDay) { leaveTag(curDay); curDay = 0; }
    const hsh = (location.hash || "#heute").slice(1);
    const main = $("#main"); main.innerHTML = ""; const root = document.createElement("div"); root.className = "view"; main.appendChild(root);
    let nav = "module"; const [a, ...rest] = hsh.split("-"); const b = rest.join("-");
    try {
      if (hsh === "heute" || hsh === "") { nav = "heute"; viewHeute(root); }
      else if (hsh === "plan") { nav = "plan"; viewPlan(root); }
      else if (a === "tag") { nav = "plan"; curDay = +b; viewTag(root, +b); }
      else if (hsh === "module") viewModule(root);
      else if (hsh === "pruefung") { nav = "pruefung"; viewPruefung(root); }
      else if (a === "mock") { nav = "pruefung"; viewMock(root, b); }
      else if (hsh === "grundlagen") { nav = "grundlagen"; viewGrundlagen(root); }
      else if (a === "g") viewGramTopic(root, b);
      else if (a === "read") viewReadText(root, b);
      else if (a === "lit") viewLit(root, b);
      else if (a === "hv") viewHV(root, b);
      else if (a === "sm") viewSM(root, b);
      else if (a === "clip") viewClip(root, b);
      else if (a === "op") viewOperatoren(root, b.replace(/-/g, " "));
      else if (a === "m") {
        ({ diag: viewDiag, vocab: viewVocab, grammar: viewGrammar, read: viewRead, listen: viewListen, write: viewWrite, mediation: viewMediation, analysis: viewAnalysis, speak: viewSpeak, culture: viewCulture, strategy: viewStrategy, operatoren: viewOperatoren, redemittel: viewRedemittel, podcast: viewPodcast, video: viewVideo, final: viewFinal }[b] || viewModule)(root);
      } else { nav = "heute"; viewHeute(root); }
    } catch (e) { root.innerHTML = `<p class="bad">Diese Ansicht konnte nicht geladen werden: ${esc(e.message)}</p><a href="#heute">Zur Startseite</a>`; console.error(e); }
    $$(".nav a").forEach((x) => x.setAttribute("aria-current", x.dataset.nav === nav ? "page" : "false"));
    const hd = $("h1", root); if (hd) { hd.tabIndex = -1; }
  }
  window.rerender = route;
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); const hd = $("#main h1"); if (hd) hd.focus({ preventScroll: true }); });
  document.addEventListener("DOMContentLoaded", () => {
    const sel = $("#kurs"); sel.value = S.kurs;
    sel.onchange = () => { S.kurs = sel.value; save(); route(); };
    route();
  });
  if (document.readyState !== "loading") { const sel = $("#kurs"); if (sel) { sel.value = S.kurs; sel.onchange = () => { S.kurs = sel.value; save(); route(); }; route(); } }
})();

</script>
